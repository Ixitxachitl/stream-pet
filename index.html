function startChat() {
  if (CFG.channel) connectTwitch(CFG.channel.toLowerCase().replace(/^#/, ''));
  if (CFG.kick) connectKick(CFG.kick.toLowerCase());
  if (CFG.tiktok) connectBridge(CFG.tiktok === '1' ? 'ws://localhost:21213/' : CFG.tiktok, 'tiktok');
  if (CFG.youtube) {
    if (/^wss?:\/\//.test(CFG.youtube)) connectBridge(CFG.youtube, 'youtube');
    else if (CFG.ytkey) connectYouTube(ytId(CFG.youtube), CFG.ytkey);
  }
  if (CFG.demo) runDemo();
}

// ---------------- talking: words it picks up from chat ----------------
// With "Learn words from chat" on, the pet slowly picks up chat's words and mixes them into silly
// little phrases (a tiny Markov chain). Kept small and careful:
//  - a word is only learned once 3 different chatters have used it, so one person can't teach it
//    anything, but chat's running jokes catch on fast
//  - links, @mentions, anything with numbers, long words, !commands, bots and first-time chatters
//    are never learned, nor anything on a public bad-words list or your own never-learn list
//  - at most 300 words, each remembering up to 6 words that follow it; the least used are forgotten
//  - mods (and you) can type !pet forget <word>, and the settings can wipe it all
// It learns nothing at all until the bad-words list has loaded.
const VOCAB_MAX = 300, CAND_MAX = 600, NEXT_MAX = 6, TEACHERS = 3;
let badWords = null, badPhrases = [];
const neverLearn = new Set(CFG.neverlearn.toLowerCase().split(/[\s,]+/).filter(Boolean));
if (CFG.talk) {
  fetch('https://cdn.jsdelivr.net/npm/naughty-words@1.2.0/en.json')
    .then(r => r.json())
    .then(list => {
      badWords = new Set(list.filter(w => !w.includes(' ')).map(w => w.toLowerCase()));
      badPhrases = list.filter(w => w.includes(' ')).map(w => w.toLowerCase());
    })
    .catch(() => console.warn('[pet] bad-words list failed to load; not learning words this session'));
}
const vocab = () => (save.vocab ??= { known: {}, cand: {} });
const vocabSize = () => Object.keys(vocab().known).filter(w => w !== '^').length;

function isBad(w) {
  const l = w.toLowerCase();
  if (neverLearn.has(l) || badWords.has(l)) return true;
  for (const b of badWords) if (b.length >= 4 && l.includes(b)) return true; // stems inside longer words
  return false;
}
// a chat word worth learning: letters only (emote names count), not too short or long, nothing bad
function cleanWord(raw) {
  const w = raw.replace(/^[^\p{L}]+|[^\p{L}]+$/gu, '');
  if (w.length < 2 || w.length > 14 || /[^\p{L}']/u.test(w)) return null;
  if (/[@/:.]/.test(raw) || /\d/.test(raw)) return null;
  // emote-style CamelCase keeps its case; everything else is lower case
  const word = /^[A-Z]?[a-z]+[A-Z]/.test(w) ? w : w.toLowerCase();
  return isBad(word) ? null : word;
}

function learnFrom(text, name, platform) {
  if (!CFG.talk || !badWords || !counts() || /^\s*!/.test(text)) return;
  const V = vocab(), who = hashStr(platform + ':' + String(name).toLowerCase()), now = save.t;
  let prev = '^';
  for (const raw of text.split(/\s+/).slice(0, 20)) {
    const w = raw && cleanWord(raw);
    if (!w) { prev = null; continue; } // a skipped word breaks the chain
    // words still being learned keep who's said them and what followed them, so nothing chat said
    // before a word caught on is wasted; they're only ever spoken once learned
    let k = V.known[w];
    if (!k) {
      const c = V.cand[w] ??= { h: [], nx: {} };
      if (!c.h.includes(who)) c.h.push(who);
      if (c.h.length >= TEACHERS) { delete V.cand[w]; k = V.known[w] = { c: 1, t: now, nx: c.nx }; }
    } else { k.c++; k.t = now; }
    if (prev) addNext(prev === '^' ? (V.known['^'] ??= { c: 0, t: now, nx: {} }) : (V.known[prev] ?? V.cand[prev]), w);
    prev = w;
  }
  if (prev && prev !== '^') addNext(V.known[prev] ?? V.cand[prev], '$');
  trimVocab();
}
function addNext(from, w) {
  if (!from) return;
  from.nx[w] = (from.nx[w] ?? 0) + 1;
  const nk = Object.keys(from.nx);
  if (nk.length > NEXT_MAX) delete from.nx[nk.reduce((a, b) => (from.nx[a] <= from.nx[b] ? a : b))];
}
// forget the least useful words: rarely used and not heard in a while
function trimVocab() {
  const V = vocab(), day = 86400;
  const score = (k) => k.c / (1 + (save.t - k.t) / day);
  const words = Object.keys(V.known).filter(w => w !== '^');
  if (words.length > VOCAB_MAX) {
    words.sort((a, b) => score(V.known[a]) - score(V.known[b]));
    for (const w of words.slice(0, words.length - VOCAB_MAX)) forgetWord(w);
  }
  const cand = Object.keys(V.cand);
  if (cand.length > CAND_MAX) for (const w of cand.slice(0, cand.length - CAND_MAX)) delete V.cand[w];
}
function forgetWord(word) {
  const V = vocab(), l = word.toLowerCase();
  for (const w of Object.keys(V.known)) {
    if (w.toLowerCase() === l) delete V.known[w];
    else for (const n of Object.keys(V.known[w].nx)) if (n.toLowerCase() === l) delete V.known[w].nx[n];
  }
  for (const w of Object.keys(V.cand)) {
    if (w.toLowerCase() === l) delete V.cand[w];
    else for (const n of Object.keys(V.cand[w].nx)) if (n.toLowerCase() === l) delete V.cand[w].nx[n];
  }
}

// Its own baby talk, from syllables picked by its seed, so every pet babbles a bit differently.
function babble(n = 1 + Math.floor(Math.random() * 2)) {
  const r = rngFrom(hashStr('babble:' + save.seed));
  const sy = Array.from({ length: 5 }, () => ['m', 'b', 'p', 'n', 'w', 'bl', 'pr', 'gl', 'l', 'y'][Math.floor(r() * 10)] +
    ['i', 'a', 'o', 'u', 'ee', 'oo', 'ip', 'op', 'ub', 'eep'][Math.floor(r() * 10)]);
  return Array.from({ length: n }, () => { const s = sy[Math.floor(Math.random() * sy.length)]; return Math.random() < 0.3 ? s + s : s; }).join(' ');
}
const pickWeighted = (obj) => {
  const e = Object.entries(obj), tot = e.reduce((a, [, c]) => a + c, 0);
  let x = Math.random() * tot;
  for (const [k, c] of e) if ((x -= c) <= 0) return k;
  return e[e.length - 1]?.[0];
};
// Something to say, matched to how grown up it is: babies babble, children try single words, teens
// put two together, adults and elders manage short phrases.
function phrase() {
  const V = vocab(), known = Object.keys(V.known).filter(w => w !== '^');
  const st = save.stage, maxLen = { baby: 0, child: 1, teen: 2, adult: 5, elder: 5 }[st] ?? 0;
  if (!maxLen || known.length < 3 || Math.random() < 0.2) return babble() + (Math.random() < 0.5 ? '!' : '');
  const learned = (nx) => Object.fromEntries(Object.entries(nx).filter(([n]) => n === '$' || V.known[n]));
  let words = [];
  for (let tries = 0; tries < 6 && words.length < Math.min(2, maxLen); tries++) {
    words = [];
    const starts = V.known['^'] ? learned(V.known['^'].nx) : {};
    let w = Object.keys(starts).length && Math.random() < 0.7 ? pickWeighted(starts) : pickWeighted(Object.fromEntries(known.map(k => [k, V.known[k].c])));
    while (w && w !== '$' && words.length < maxLen) {
      words.push(w);
      const nx = learned(V.known[w].nx);
      w = Object.keys(nx).length && Math.random() < 0.9 ? pickWeighted(nx) : null;
    }
  }
  if (!words.length) return babble();
  if (maxLen === 1 && Math.random() < 0.3) words.push(words[0]);    // "pog pog"
  if (Math.random() < 0.25) words.push(babble(1));                   // a bit of baby talk mixed in
  const text = words.join(' ');
  if (badPhrases.some(b => (' ' + text.toLowerCase() + ' ').includes(' ' + b + ' '))) return babble();
  return text + ['', '!', '!!', '?', '~', '...'][Math.floor(Math.random() * 6)];
}

// Speech goes in the bubble too, in the pixel font.
function say(text = phrase()) {
  if (!text || save.stage === 'egg') return;
  showBubble(text, true);
  if (!pet.asleep) pet.mood('happy', 1);
  sfx('chirp');
}
// Every few minutes it pipes up (more often the more sociable it is), and it mumbles in its sleep.
let sayTimer = rand(40, 90);
function tickTalk(dt) {
  if (!CFG.talk || save.stage === 'egg' || cutscene || !onScreen()) return;
  if ((sayTimer -= dt) > 0) return;
  const sociable = clamp(share(save, 'social') * 3, 0, 1);
  sayTimer = rand(90, 240) * (1 - 0.5 * sociable);
  if (pet.asleep) {
    const V = vocab(), known = Object.keys(V.known).filter(w => w !== '^');
    const word = known.length && Math.random() < 0.6 ? known[Math.floor(Math.random() * known.length)] : babble(1);
    say(`zzz... ${word}... zzz`);
  } else say();
}

// ---- status card: name, stage and needs, over the pet ----
// ?status=events (default) shows it for a while on big moments and !pet stats, always keeps it up,
// off never shows it. It never says anything about evolution.
const statusEl = document.getElementById('status');
let statusUntil = CFG.status === 'always' ? Infinity : 0, statusTick = 0;
function showStatus(ms = 6000) { if (CFG.status !== 'off') statusUntil = Math.max(statusUntil, performance.now() + ms); }
const STAGE_NAMES = { egg: 'Egg', baby: 'Baby', child: 'Child', teen: 'Teen', adult: 'Adult', elder: 'Elder' };
function updateStatusText() {
  if (performance.now() < statusTick) return;
  statusTick = performance.now() + 500;
  const age = ageHours(), ageTxt = age < 1 ? Math.round(age * 60) + ' min' : age.toFixed(age < 10 ? 1 : 0) + ' h';
  statusEl.querySelector('.n').textContent = save.name ?? 'Egg';
  statusEl.querySelector('.s').textContent = `${save.stage === 'adult' || save.stage === 'elder' ? save.formName + ' · ' : ''}${STAGE_NAMES[save.stage]} · ${ageTxt}`;
  statusEl.querySelector('.bars').style.display = save.stage === 'egg' ? 'none' : '';
  for (const [k, v] of Object.entries(N)) {
    const bar = statusEl.querySelector(`[data-k="${k}"] i`);
    bar.style.width = v.toFixed(0) + '%';
    bar.style.setProperty('--c', v > 60 ? '#5cc04a' : v > 30 ? '#f2c14e' : '#ff5d73');
  }
}

// The status card, the banner and the thought bubble all live over the pet's head, so they're laid
// out together instead of on top of each other: the card sits just above the head, the banner above
// the card, and the bubble beside the card (or over the head when there's no card). Everything is
// kept on screen.
function placeOverlays() {
  const now = performance.now(), q = pet.pos(), M = 8;
  const [hx, hy] = toScreen(q.x, q.y + pet.hy + 1.5);
  let top = hy, card = null;

  const statusOn = now < statusUntil;
  statusEl.classList.toggle('show', statusOn);
  if (statusOn) {
    updateStatusText();
    const w = statusEl.offsetWidth, h = statusEl.offsetHeight;
    const cx = clamp(hx, w / 2 + M, innerWidth - w / 2 - M), bottom = Math.max(h + M, top);
    statusEl.style.left = cx + 'px';
    statusEl.style.top = bottom + 'px';
    card = { left: cx - w / 2, right: cx + w / 2, top: bottom - h };
    top = card.top - 10;
  }

  if (now < bannerUntil) {
    const w = bannerEl.offsetWidth, h = bannerEl.offsetHeight, bottom = Math.max(h + M, top);
    // placed with left/bottom, not a transform: the pop-in animation scales transforms too, which
    // made it fly in from the corner
    bannerEl.style.left = (clamp(hx, w / 2 + M, innerWidth - w / 2 - M) - w / 2) + 'px';
    bannerEl.style.bottom = (innerHeight - bottom) + 'px';
  } else bannerEl.classList.remove('show');

  if (now < bubbleUntil) {
    // (x, y) is the bubble's bottom-left corner; its thinking dots hang below that
    const w = bubbleEl.offsetWidth, h = bubbleEl.offsetHeight;
    let x, y;
    if (card) {
      x = card.right + 10 + w < innerWidth - M ? card.right + 10 : card.left - w - 10;
      y = card.top + h;
    } else {
      const [hx2, hy2] = toScreen(q.x + pet.hx * 0.4, q.y + pet.hy + 2);
      x = hx2 - 6; y = hy2 - 34;
    }
    x = clamp(x, M, innerWidth - w - M);
    y = Math.max(h + M, y);
    // follow the pet smoothly rather than copying every hop and bounce
    const k = bubblePos ? 1 - Math.exp(-Math.min(0.1, (now - bubbleAt) / 1000) * 7) : 1;
    bubblePos = bubblePos ? [bubblePos[0] + (x - bubblePos[0]) * k, bubblePos[1] + (y - bubblePos[1]) * k] : [x, y];
    bubbleAt = now;
    bubbleEl.style.left = bubblePos[0].toFixed(1) + 'px';          // left/bottom, not a transform (see the banner)
    bubbleEl.style.bottom = (innerHeight - bubblePos[1]).toFixed(1) + 'px';
  } else bubbleEl.classList.remove('show');
}

// ---------------- broom ----------------
// The auto-clean: a little broom drops in next to the poop, sweeps a few times and it's gone.
const effects = [];
function sweepAway(poop) {
  const v = new Vox();
  for (let y = 3; y < 11; y++) v.set(0, y, 0, 0x9a6a3a);              // handle
  for (let x = -2; x <= 2; x++) for (let y = 0; y < 3; y++) v.set(x, y, 0, y === 2 ? 0xb03a2e : 0xf2c14e);
  const g = new THREE.Group(), m = voxMesh(v);
  m.position.set(-0.5, 0, -0.5);
  g.add(m);
  scene.add(g);
  const fx = { done: false, t: 0, g, poop, side: Math.random() < 0.5 ? -1 : 1 };
  fx.step = (dt) => {
    fx.t += dt;
    const pp = poop.gone ? fx.last : poop.pos();
    fx.last = pp;
    const pop = Math.min(1, fx.t * 5), out = fx.t > 2.2 ? Math.max(0, 1 - (fx.t - 2.2) * 5) : 1;
    g.scale.setScalar(pop * out * 0.8);
    const swish = Math.sin(fx.t * 14);
    g.position.set(pp.x + fx.side * (3 + swish * 1.5), 0.2, 1.5);
    g.rotation.z = fx.side * (0.5 + swish * 0.35);
    if (fx.t > 0.4 && Math.random() < 0.3) spawnBits(pp.x, 0.5, [0xd8c8a8], 1, { vx: -fx.side * 6, vy: 6, size: 0.35, life: 0.6 });
    if (fx.t > 1.8 && !poop.gone) {
      spawnBits(pp.x, 1.5, SPARKLE, 14, { vy: 10, spread: 10, size: 0.45, life: 1.2, grav: 0 });
      sfx('poof');
      poop.remove();
    }
    if (fx.t > 2.4) { scene.remove(g); fx.done = true; }
  };
  effects.push(fx);
  return fx;
}
function stepEffects(dt) {
  for (let i = effects.length - 1; i >= 0; i--) { effects[i].step(dt); if (effects[i].done) effects.splice(i, 1); }
}


// ---------------- sound (optional, off by default) ----------------
// Tiny synthesized blips, no files. In OBS, tick "Control audio via OBS" on the browser source to hear
// them and set their volume there too.
let AC = null;
function sfx(kind) {
  if (!CFG.sfx || document.hidden) return;
  try { AC ??= new AudioContext(); } catch (e) { return; }
  if (AC.state === 'suspended') AC.resume();
  const t = AC.currentTime, vol = CFG.sfx / 100 * 0.25;
  const tone = (f0, f1, dur, type = 'sine', at = 0, v = 1) => {
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f0, t + at);
    o.frequency.exponentialRampToValueAtTime(f1, t + at + dur);
    g.gain.setValueAtTime(0.0001, t + at);
    g.gain.exponentialRampToValueAtTime(vol * v, t + at + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + at + dur);
    o.connect(g).connect(AC.destination);
    o.start(t + at); o.stop(t + at + dur + 0.02);
  };
  const noise = (dur, at = 0, v = 1, freq = 1200) => {
    const b = AC.createBuffer(1, Math.ceil(AC.sampleRate * dur), AC.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
    const src = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
    src.buffer = b; f.type = 'bandpass'; f.frequency.value = freq; g.gain.value = vol * v;
    src.connect(f).connect(g).connect(AC.destination);
    src.start(t + at);
  };
  const pitch = 1.6 - Math.min(0.8, (pet?.S.h ?? 8) / 20); // small critters squeak higher
  if (kind === 'hop') tone(220 * pitch, 440 * pitch, 0.12, 'sine', 0, 0.5);
  else if (kind === 'chomp') noise(0.07, 0, 0.9, 900);
  else if (kind === 'chirp') { tone(700 * pitch, 1100 * pitch, 0.08); tone(900 * pitch, 1400 * pitch, 0.1, 'sine', 0.1); }
  else if (kind === 'coin') { tone(988, 988, 0.08, 'square', 0, 0.35); tone(1319, 1319, 0.25, 'square', 0.08, 0.35); }
  else if (kind === 'sparkle') [0, 4, 7, 12, 16].forEach((n, i) => tone(523 * 2 ** (n / 12), 523 * 2 ** (n / 12), 0.25, 'triangle', i * 0.07, 0.6));
  else if (kind === 'poof') noise(0.3, 0, 0.6, 2500);
  else if (kind === 'crack') noise(0.05, 0, 1, 3000);
}

// ---------------- bubbles and floating text (DOM, over the canvas) ----------------
const projV = new THREE.Vector3();
function toScreen(x, y) {
  projV.set(x, y, 0).project(cam);
  return [(projV.x + 1) / 2 * innerWidth, (1 - projV.y) / 2 * innerHeight];
}
const bubbleEl = document.getElementById('bubble');
let bubbleUntil = 0;
function showBubble(icon, speech = false) {
  bubbleEl.textContent = icon;
  bubbleEl.classList.toggle('say', speech);
  bubbleUntil = performance.now() + (speech ? 4000 : 2600);
  bubblePos = null;   // place it before it shows, so it doesn't flash up where the last one was
  placeOverlays();
  bubbleEl.classList.remove('show'); void bubbleEl.offsetWidth; bubbleEl.classList.add('show');
}
let bubblePos = null, bubbleAt = 0;
function floatText(x, y, text, cls) {
  const el = document.createElement('div');
  el.className = 'float ' + (cls || '');
  el.textContent = text;
  const [sx, sy] = toScreen(x, y);
  el.style.left = sx + 'px'; el.style.top = sy + 'px';
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 2600);
}

// ---------------- loop ----------------
if (save.formId) {
  const f = formById(save.formId);
  if (f) { save.stage = f.stage; save[f.stage === 'teen' ? 'teen' : 'form'] = f.recipe; save.formName = f.name; pal = palFor(save); }
}
let pet = new Pet(recipeFor(save.stage), save.stage, (B.left + B.right) / 2);
placeBed(B.left + 14);
if (!TESTING) {
  if (CFG.name && save.stage !== 'egg') save.name = CFG.name;
  catchUp((Date.now() - save.lastSeen) / 1000);
  writeSave();
  setInterval(writeSave, 30000);
  addEventListener('pagehide', writeSave);
}
startChat();
if (CFG.ball) dropBall();
function dropThing(kind = 'ball') {
  if (kind === 'ball') dropBall();
  else if (kind === 'poop') dropPoop(pet.pos().x + (pet.facing ? -pet.facing * 6 : 6), 10);
  else if (kind === 'food' || FOODS[kind]) dropFood(FOODS[kind] ? kind : undefined);
  // stream events, for testing
  else if (kind === 'raid') onRaid({ name: 'TestRaider', viewers: 40 });
  else if (kind === 'sub') onSub({ name: 'TestSubber', count: 1 });
  else if (kind === 'bits') onBits({ name: 'TestCheerer', amount: 500 });
  else if (kind === 'chat') onChat({ name: 'test_chatter', text: 'hi!' });
}
for (const k of (Q.get('drop') || '').split(',').filter(Boolean)) dropThing(k);

let debugLines = null;
if (CFG.debug) {
  debugLines = new THREE.LineSegments(new THREE.BufferGeometry(),
    new THREE.LineBasicMaterial({ vertexColors: true, depthTest: false }));
  debugLines.renderOrder = 99;
  scene.add(debugLines);
}
const hud = document.getElementById('hud');

function stepSim(dt) {
  if (!pet.S.egg) tickLife(dt);
  tickAge(dt);
  if (cutscene) stepCutscene(dt);
  pet.step(dt);
  stepEffects(dt);
  spoilFood(dt);
  tickTalk(dt);
  world.step();
  // anything that escaped the walls comes back in from above
  for (const pr of [pet, ...props]) {
    if (pr.body.isFixed() || pr.leaving) continue;
    const p = pr.body.translation();
    if (p.y < -30 || p.x < B.left - 5 || p.x > B.right + 5) {
      pr.body.setTranslation({ x: clamp(p.x, B.left + 8, B.right - 8), y: 40, z: 0 }, true);
      pr.body.setLinvel({ x: 0, y: 0, z: 0 }, true);
    }
  }
}

// ?settle=N runs N seconds of simulation up front (screenshots, headless tests)
for (let i = 0, n = num('settle', 0, 0, 600) / STEP; i < n; i++) { stepSim(STEP); if (i % 4 === 0) pet.update(STEP * 4); }

let hidden = document.hidden, hiddenAt = Date.now(), last = performance.now(), acc = 0, fps = 0;
function setHidden(h) {
  if (h === hidden) return;
  hidden = h;
  // time spent hidden goes to the life simulation as time away, never to the physics
  if (h) { hiddenAt = Date.now(); writeSave(); } else catchUp((Date.now() - hiddenAt) / 1000);
  last = performance.now(); acc = 0;
}
document.addEventListener('visibilitychange', () => setHidden(document.hidden));
addEventListener('obsSourceVisibleChanged', e => setHidden(!(e.detail && e.detail.visible)));

function frame(now) {
  requestAnimationFrame(frame);
  if (hidden) return;
  const dt = Math.min(0.1, (now - last) / 1000);
  last = now;
  fps += ((dt > 0 ? 1 / dt : 60) - fps) * 0.05;
  lastFrameAt = now;
  acc += dt;
  let n = 0;
  while (acc >= STEP && n < 6) { stepSim(STEP); acc -= STEP; n++; }
  if (n === 6) acc = 0;

  pet.update(dt);
  for (const pr of props) pr.update();
  updateBits(dt);
  placeOverlays();
  if (debugLines) {
    const { vertices, colors } = world.debugRender();
    debugLines.geometry.setAttribute('position', new THREE.BufferAttribute(vertices, 3));
    debugLines.geometry.setAttribute('color', new THREE.BufferAttribute(colors, 4));
    const p = pet.pos();
    hud.textContent = `fps ${fps.toFixed(0)}\n` +
      `${save.name ?? '(egg)'}  gen ${save.gen}  ${save.stage}  age ${ageHours().toFixed(2)}h  form ${save.formName ?? '-'}  seed ${save.seed}  pattern ${pal.pattern}${TESTING ? '  (test, not saved)' : ''}\n` +
      `action ${pet.action?.name}  grounded ${pet.grounded}  dazed ${pet.dazed > 0}  asleep ${pet.asleep}\n` +
      `needs ${Object.entries(N).map(([k, v]) => k + ' ' + v.toFixed(0)).join('  ')}  health ${life.health.toFixed(0)}\n` +
      `wants ${Object.entries(pet.scores).sort((a, b) => b[1] - a[1]).map(([k, v]) => k + ' ' + v.toFixed(2)).join('  ')}\n` +
      `traits ${TRAITS.map(k => k + ' ' + save.traits[k].toFixed(1)).join('  ')}\n` +
      (save.lineage.length ? `family ${save.lineage.map(l => `${l.name} (${l.form ?? '?'})`).join(' → ')}\n` : '') +
      (CFG.talk ? `words ${vocabSize()} known, ${Object.keys(vocab().cand).length} heard${badWords ? '' : ' (bad-words list not loaded)'}\n` : '') +
      `props ${Object.entries(props.reduce((o, pr) => (o[pr.food ?? pr.kind] = (o[pr.food ?? pr.kind] ?? 0) + 1, o), {})).map(([k, v]) => k + ' ' + v).join('  ')}\n` +
      `pos ${p.x.toFixed(1)}, ${p.y.toFixed(1)}, ${p.z.toFixed(1)}  walls ${B.left.toFixed(0)}..${B.right.toFixed(0)}`;
  }
  renderer.render(scene, cam);
}
requestAnimationFrame(frame);


// ---------------- settings window ----------------
// The gear's cog, drawn as pixel art: 8 teeth on a 21 × 21 grid, white with an ink outline.
function pixelCog(N = 21, teeth = 8) {
  const c = (N - 1) / 2, fill = new Set(), px = [];
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    const r = Math.hypot(x - c, y - c), f = ((Math.atan2(y - c, x - c) / (2 * Math.PI) * teeth) % 1 + 1) % 1;
    if (r > 2.6 && r <= (Math.min(f, 1 - f) < 0.21 ? 9.4 : 7)) fill.add(y * N + x);
  }
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    const i = y * N + x;
    const edge = [[1, 0], [-1, 0], [0, 1], [0, -1]].some(([dx, dy]) => fill.has((y + dy) * N + x + dx) && x + dx >= 0 && x + dx < N);
    if (fill.has(i) || edge) px.push(`<rect x="${x}" y="${y}" width="1" height="1" fill="${fill.has(i) ? '#fff' : '#1f1830'}"/>`);
  }
  return `<svg viewBox="0 0 ${N} ${N}" shape-rendering="crispEdges">${px.join('')}</svg>`;
}
// Open it from OBS: right-click the source → Interact, move the mouse, click the gear.
(function settingsUI() {
  const gear = document.createElement('button');
  gear.id = 'gear'; gear.title = 'Stream Pet settings';
  gear.innerHTML = pixelCog();
  document.body.appendChild(gear);

  const panel = document.createElement('div');
  panel.id = 'settings';
  panel.innerHTML = `<div class="sp" role="dialog" aria-label="Stream Pet settings">
    <div class="sp-head"><h2>Stream Pet — Settings</h2>
      <p>Saved in this browser source and applied when you press <b>Save &amp; apply</b>. Heads up: this window shows on stream while it's open.</p></div>
    <div class="sp-body"></div>
    <div class="sp-foot">
      <button class="sp-btn" data-act="test">Test chat</button>
      <button class="sp-btn" data-act="link">Copy setup link</button>
      <button class="sp-btn warn" data-act="defaults">Defaults</button>
      <span class="sp-msg grow"></span>
      <button class="sp-btn" data-act="close">Cancel</button>
      <button class="sp-btn go" data-act="save">Save &amp; apply</button>
      <input class="sp-link" readonly>
    </div></div>`;
  document.body.appendChild(panel);
  const body = panel.querySelector('.sp-body'), msg = panel.querySelector('.sp-msg'), linkBox = panel.querySelector('.sp-link');
  const inputs = {};

  let sec = null;
  for (const f of FIELDS) {
    if (f.sec) {
      sec = document.createElement('div'); sec.className = 'sp-sec';
      const h = document.createElement('h3'); h.textContent = f.sec; sec.appendChild(h);
      body.appendChild(sec); continue;
    }
    const wrapF = document.createElement('div'); wrapF.className = 'sp-f';
    const id = 'sp-' + f.k;
    const lab = document.createElement('label'); lab.htmlFor = id; lab.textContent = f.label;
    let inp;
    if (f.type === 'bool') {
      const row = document.createElement('div'); row.className = 'sp-row';
      const sw = document.createElement('span'); sw.className = 'sw';
      inp = document.createElement('input'); inp.type = 'checkbox';
      sw.append(inp, document.createElement('i'));
      row.append(lab, sw); wrapF.appendChild(row);
    } else if (f.type === 'select') {
      inp = document.createElement('select');
      for (const [v, t] of f.opts) { const o = document.createElement('option'); o.value = v; o.textContent = t; inp.appendChild(o); }
      wrapF.append(lab, inp);
    } else {
      inp = document.createElement('input');
      inp.type = f.type === 'num' ? 'number' : f.type;
      if (f.type === 'num') { inp.min = f.min; inp.max = f.max; inp.step = f.step; }
      if (f.ph) inp.placeholder = f.ph;
      inp.spellcheck = false; inp.autocomplete = 'off';
      wrapF.append(lab, inp);
    }
    inp.id = id;
    if (f.help) { const sm = document.createElement('small'); sm.textContent = f.help; wrapF.appendChild(sm); }
    if (f.k in fromURL) {
      inp.disabled = true;
      const sm = document.createElement('small'); sm.className = 'url';
      sm.textContent = 'Set by the source URL, which overrides this.';
      wrapF.appendChild(sm);
    }
    inputs[f.k] = inp;
    sec.appendChild(wrapF);
  }

  // the pet itself: export, import and start over
  const petSec = document.createElement('div');
  petSec.className = 'sp-sec';
  petSec.innerHTML = `<h3>Your pet</h3>
    <div class="sp-f"><small class="who"></small></div>
    <div class="sp-f"><label for="sp-io">Back up or move your pet</label>
      <textarea id="sp-io" spellcheck="false" placeholder="Export puts your pet here as text. To import, paste one here."></textarea>
      <div class="sp-row2"><button class="sp-btn sm" data-pet="export">Export</button><button class="sp-btn sm" data-pet="import">Import</button></div>
      <small>Keep a copy somewhere safe: clearing OBS's browser cache would lose it.</small></div>
    <div class="sp-f"><button class="sp-btn sm warn" data-pet="forget">Forget every word it's learned…</button></div>
    <div class="sp-f"><button class="sp-btn sm warn" data-pet="reset">Start over with a new egg…</button></div>`;
  body.appendChild(petSec);
  const io = petSec.querySelector('#sp-io'), who = petSec.querySelector('.who');
  let resetArmed = false;
  petSec.addEventListener('click', (e) => {
    const act = e.target.dataset?.pet;
    if (!act) return;
    if (TESTING) { msg.textContent = 'This is a test pet (stage/seed/form in the URL), so there\'s nothing to save.'; return; }
    if (act === 'export') {
      writeSave();
      io.value = JSON.stringify(save);
      io.select();
      try { navigator.clipboard.writeText(io.value); msg.textContent = 'Exported and copied.'; } catch (err) { msg.textContent = 'Exported: copy it from the box.'; }
    }
    if (act === 'import') {
      let s;
      try { s = JSON.parse(io.value); } catch (err) { msg.textContent = 'That doesn\'t look like an exported pet.'; return; }
      if (!s || s.v !== 1 || !s.needs || !s.traits || !s.stage) { msg.textContent = 'That doesn\'t look like an exported pet.'; return; }
      try { localStorage.setItem(SAVE_KEY, JSON.stringify({ ...s, lastSeen: Date.now() })); } catch (err) { msg.textContent = 'Couldn\'t save here.'; return; }
      msg.textContent = `Imported ${s.name ?? 'an egg'}! Reloading…`;
      importing = true;
      setTimeout(() => location.reload(), 300);
    }
    if (act === 'forget') {
      if (e.target.dataset.armed !== '1') {
        e.target.dataset.armed = '1'; e.target.textContent = `Really forget all ${vocabSize()} words? Click again`;
        setTimeout(() => { e.target.dataset.armed = ''; e.target.textContent = 'Forget every word it\'s learned…'; }, 5000);
        return;
      }
      save.vocab = { known: {}, cand: {} }; writeSave();
      e.target.dataset.armed = ''; e.target.textContent = 'Forget every word it\'s learned…';
      msg.textContent = 'All forgotten.';
    }
    if (act === 'reset') {
      if (!resetArmed) {
        resetArmed = true;
        e.target.textContent = `Really say goodbye to ${save.name ?? 'this egg'}? Click again`;
        setTimeout(() => { resetArmed = false; e.target.textContent = 'Start over with a new egg…'; }, 5000);
        return;
      }
      try { localStorage.removeItem(SAVE_KEY); } catch (err) {}
      importing = true;
      msg.textContent = 'Starting over…';
      setTimeout(() => location.reload(), 300);
    }
  });

  const fill = (vals) => {
    for (const [k, inp] of Object.entries(inputs)) {
      const v = vals[k];
      if (FIELD[k].type === 'bool') inp.checked = !!v; else inp.value = v;
    }
  };
  const read = () => {
    const out = {};
    for (const [k, inp] of Object.entries(inputs)) out[k] = coerce(FIELD[k], FIELD[k].type === 'bool' ? inp.checked : inp.value);
    return out;
  };
  const open = () => {
    fill(SET);
    who.textContent = save.stage === 'egg' ? 'An egg, waiting to hatch.' :
      `${save.name}, generation ${save.gen}, ${Math.round(ageHours())} hours old${CFG.talk ? `, knows ${vocabSize()} words` : ''}.`;
    msg.textContent = storageOK ? '' : 'This browser source can\'t save settings — use "Copy setup link" instead.';
    linkBox.style.display = 'none';
    panel.classList.add('open');
  };
  const close = () => panel.classList.remove('open');

  gear.addEventListener('click', open);
  panel.addEventListener('mousedown', e => { if (e.target === panel) close(); });
  addEventListener('keydown', e => { if (e.key === 'Escape') close(); });

  panel.querySelector('.sp-foot').addEventListener('click', e => {
    const act = e.target.dataset && e.target.dataset.act;
    if (!act) return;
    if (act === 'close') close();
    if (act === 'test') {
      onChat({ name: 'test_chatter_' + Math.floor(Math.random() * 1000), text: 'hello!' });
      msg.textContent = 'Sent a test chat message.';
    }
    if (act === 'defaults') {
      const d = {}; for (const f of Object.values(FIELD)) d[f.k] = f.def;
      fill(d); msg.textContent = 'Defaults filled in — press Save & apply to keep them.';
    }
    if (act === 'link') {
      const vals = read(), q = new URLSearchParams();
      for (const f of Object.values(FIELD)) {
        const v = vals[f.k];
        if (v === f.def) continue;
        q.set(f.k, f.type === 'bool' ? (v ? '1' : '0') : String(v));
      }
      const link = location.href.split(/[?#]/)[0] + (q.toString() ? '?' + q.toString() : '');
      linkBox.value = link; linkBox.style.display = 'block'; linkBox.select();
      const done = () => { msg.textContent = 'Setup link copied' + (vals.ytkey ? ' (it includes your YouTube API key — keep it private).' : '.'); };
      try { navigator.clipboard.writeText(link).then(done, () => { document.execCommand('copy'); done(); }); }
      catch (err) { try { document.execCommand('copy'); done(); } catch (e2) { msg.textContent = 'Copy the link from the box below.'; } }
    }
    if (act === 'save') {
      try {
        const vals = read();
        // fields locked by the URL keep whatever was saved before (the URL value isn't a choice made here)
        for (const k in fromURL) { if (k in savedSettings) vals[k] = coerce(FIELD[k], savedSettings[k]); else delete vals[k]; }
        localStorage.setItem(SETTINGS_KEY, JSON.stringify(vals));
        writeSave();
        msg.textContent = 'Saved! Reloading…';
        setTimeout(() => location.reload(), 250);
      } catch (err) {
        msg.textContent = 'Couldn\'t save here — use "Copy setup link" and paste it as the source URL.';
      }
    }
  });

  // gear only appears while a mouse is over the overlay (i.e. in OBS's Interact window)
  let mt;
  addEventListener('mousemove', () => {
    document.body.classList.add('mouse');
    clearTimeout(mt); mt = setTimeout(() => document.body.classList.remove('mouse'), 3000);
  });
  document.addEventListener('mouseleave', () => document.body.classList.remove('mouse'));
})();

// ---------------- testing API ----------------
window.pet = {
  chat: (name, text = '') => onChat({ name, text }),
  sub: (name, count = 1) => onSub({ name, count }),
  bits: (name, amount = 100) => onBits({ name, amount }),
  raid: (name, viewers = 1) => onRaid({ name, viewers }),
  follow: (name) => onFollow({ name }),
  feed(kind) { if (save.stage !== 'egg') dropFood(FOODS[kind] ? kind : undefined, spotNear(pet.pos().x, rand(-15, 15))); },
  play() { if (save.stage !== 'egg') startAction(pet, 'play'); },
  say: (text) => say(text),
  words: () => Object.keys(vocab().known).filter(w => w !== '^'),
  stats() { showStatus(6000); return { name: save.name, stage: save.stage, age: ageHours(), ...N, health: life.health }; },
  hop() { startAction(pet, 'wander'); },
  do(name) { if (ACTIONS[name]) startAction(pet, name); },
  set(k, v) { if (k in N) N[k] = clamp(v, 0, 100); else if (k === 'health') life.health = clamp(v, 0, 100); },
  needs: () => ({ ...N, health: life.health }),
  knock(power = 1) {
    const b = pet.body, m = b.mass(), s = Math.random() < 0.5 ? -1 : 1;
    b.applyImpulse({ x: m * 25 * s * power, y: m * 30 * power, z: 0 }, true);
    b.applyTorqueImpulse({ x: 0, y: 0, z: -s * pet.inertia * 9 * power }, true);
  },
  drop: dropThing,
  stage(s) { if (STAGES[s]) { const p = pet.pos(); pet.build(STAGES[s], s, p.x, p.y + 6); } },
  evolve() { if (NEXT[save.stage] && !cutscene) evolve(NEXT[save.stage]); },
  save: () => JSON.parse(JSON.stringify(save)),
  expr(e) { pet.expr = e; },
};
