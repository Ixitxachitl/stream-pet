<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Stream Pet</title>
<!--
  STREAM PET — OBS Browser Source overlay
  A little voxel critter that lives along the bottom of your stream and looks after itself.
  ------------------------------------------------------------
  Add as a Browser Source at your canvas size (e.g. 1920x1080). The background is transparent.

  URL parameters (work in progress, the settings panel comes later):
    size      adult height on screen in px (default 160)
    ground    floor height in px from the bottom (default 0)
    xmin/xmax left/right walls in % of the width (default 0/100)
    seed      look of the pet (colours, pattern); random if not given
    stage     egg, baby, child or adult (default baby, until the life cycle exists)
    ball      1 = drop a ball in to play with
    drop      things to drop in at the start, for testing: drop=apple,fish,cookie,cake,poop,ball
    debug     1 = collider wireframes + a status readout
    settle    seconds of simulation to run before the first frame (for screenshots)
    speed     life-clock speed: needs fall this many times faster (for testing)
    night     local hours it wants to sleep, e.g. 1-7 (default), or off
    set       start needs for testing, e.g. set=hunger:10,energy:5

  window.pet.hop(), .knock(), .drop('ball'), .stage('adult'), .expr('happy') are there for testing.
-->
<style>
  html,body{margin:0;padding:0;overflow:hidden;background:transparent}
  canvas{display:block}
  #hud{position:fixed;left:8px;top:8px;font:12px/1.35 monospace;color:#fff;background:#000a;
    padding:6px 8px;border-radius:6px;white-space:pre;display:none;pointer-events:none}
  body.debug #hud{display:block}
  /* thought bubble: moved over the pet's head every frame */
  #bubble{position:fixed;left:0;top:0;margin:-62px 0 0 -6px;padding:10px 12px;background:#fff;border-radius:22px;
    box-shadow:0 3px 10px #0004;pointer-events:none;will-change:transform;opacity:0;transition:opacity .25s;
    font:34px/1 "Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif}
  #bubble.show{opacity:1;animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
  #bubble::after{content:"";position:absolute;left:12px;bottom:-9px;width:14px;height:14px;background:#fff;
    border-radius:50%;box-shadow:-8px 10px 0 -3px #fff}
  @keyframes pop{from{scale:.3}to{scale:1}}
  .float{position:fixed;pointer-events:none;font:700 22px/1 "Comic Neue","Comic Sans MS",sans-serif;
    animation:floatUp 2.5s ease-out forwards}
  .float.zzz{color:#e8f0ff;text-shadow:0 2px 4px #0006}
  @keyframes floatUp{0%{opacity:0;transform:translate(0,0) scale(.6)}15%{opacity:1}
    100%{opacity:0;transform:translate(26px,-90px) scale(1.4)}}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "rapier": "https://cdn.jsdelivr.net/npm/@dimforge/rapier3d-compat@0.14.0/rapier.es.js"
  }
}
</script>
</head>
<body>
<div id="hud"></div>
<div id="bubble"></div>
<script type="module">
import * as THREE from 'three';
import RAPIER from 'rapier';

// ---------------- config ----------------
const Q = new URLSearchParams(location.search);
const num = (k, def, min, max) => {
  const v = parseFloat(Q.get(k));
  return Number.isFinite(v) ? Math.min(max, Math.max(min, v)) : def;
};
const CFG = {
  size: num('size', 160, 60, 400),
  ground: num('ground', 0, 0, 2000),
  xmin: num('xmin', 0, 0, 100),
  xmax: num('xmax', 100, 0, 100),
  seed: Q.get('seed') || String(Math.floor(Math.random() * 1e9)),
  stage: ['egg', 'baby', 'child', 'adult'].includes(Q.get('stage')) ? Q.get('stage') : 'baby',
  ball: Q.get('ball') === '1',
  debug: Q.get('debug') === '1',
  speed: num('speed', 1, 0.1, 3600),
};
if (CFG.xmax - CFG.xmin < 10) { CFG.xmin = 0; CFG.xmax = 100; }
if (CFG.debug) document.body.classList.add('debug');

// World units are voxels. An adult is about 12 voxels tall, which sets the pixel scale.
const PX = CFG.size / 12;      // screen px per voxel
const GRAVITY = 160;           // voxels / s²
const STEP = 1 / 60;
// The look is "almost 2D": a nearly front-on camera, and everything moves and tips over only in the
// screen plane (z is locked to 0). The voxels still give it depth and lighting.
const PITCH = 6 * Math.PI / 180;
const FACE_YAW = 0.42;         // how far it turns toward where it's going (radians)

// ---------------- random ----------------
function hashStr(s) {
  let h = 2166136261;
  for (let i = 0; i < s.length; i++) h = Math.imul(h ^ s.charCodeAt(i), 16777619);
  return h >>> 0;
}
function rngFrom(seed) {
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const wrapAngle = (a) => Math.atan2(Math.sin(a), Math.cos(a));

// ---------------- voxels ----------------
// A sparse voxel grid. Colours are sRGB hex numbers.
class Vox {
  constructor() { this.m = new Map(); }
  static key(x, y, z) { return (x + 512) * 1048576 + (y + 512) * 1024 + (z + 512); }
  set(x, y, z, c) { this.m.set(Vox.key(x, y, z), c); }
  get(x, y, z) { return this.m.get(Vox.key(x, y, z)); }
  has(x, y, z) { return this.m.has(Vox.key(x, y, z)); }
  *each() {
    for (const [k, c] of this.m) {
      yield [Math.floor(k / 1048576) - 512, Math.floor(k / 1024) % 1024 - 512, k % 1024 - 512, c];
    }
  }
  bounds() {
    const mn = [Infinity, Infinity, Infinity], mx = [-Infinity, -Infinity, -Infinity];
    for (const [x, y, z] of this.each()) {
      mn[0] = Math.min(mn[0], x); mn[1] = Math.min(mn[1], y); mn[2] = Math.min(mn[2], z);
      mx[0] = Math.max(mx[0], x); mx[1] = Math.max(mx[1], y); mx[2] = Math.max(mx[2], z);
    }
    return [mn, mx];
  }
  // highest/frontmost solid voxel along a column, or null
  topAt(x, z) { for (let y = 64; y >= -64; y--) if (this.has(x, y, z)) return y; return null; }
  frontAt(x, y) { for (let z = 64; z >= -64; z--) if (this.has(x, y, z)) return z; return null; }
  backAt(x, y) { for (let z = -64; z <= 64; z++) if (this.has(x, y, z)) return z; return null; }
}

// Voxel mesher with per-vertex ambient occlusion. One quad per visible voxel face, on purpose: merged
// (greedy) quads leave T-junctions that show as flickering hairline cracks, and the models are tiny.
const AO_CURVE = [0.52, 0.7, 0.86, 1];
function meshVox(vox) {
  const pos = [], nor = [], col = [], idx = [];
  const [mn, mx] = vox.bounds();
  const ids = new Map(), cols = [];
  const cid = (hex) => {
    if (!ids.has(hex)) { ids.set(hex, cols.length); cols.push(new THREE.Color(hex)); }
    return ids.get(hex);
  };
  const p = [0, 0, 0], q = [0, 0, 0], t = [0, 0, 0];
  for (let d = 0; d < 3; d++) {
    const u = (d + 1) % 3, v = (d + 2) % 3;
    const du = mx[u] - mn[u] + 1, dv = mx[v] - mn[v] + 1;
    const solid = (ou, ov) => {
      t[0] = q[0]; t[1] = q[1]; t[2] = q[2]; t[u] += ou; t[v] += ov;
      return vox.has(t[0], t[1], t[2]) ? 1 : 0;
    };
    const ao = (cu, cv) => {
      const s1 = solid(cu, 0), s2 = solid(0, cv), c = solid(cu, cv);
      return s1 && s2 ? 0 : 3 - (s1 + s2 + c);
    };
    for (const s of [1, -1]) {
      for (let x = mn[d]; x <= mx[d]; x++) {
        for (let j = 0; j < dv; j++) {
          for (let i = 0; i < du; i++) {
            p[d] = x; p[u] = mn[u] + i; p[v] = mn[v] + j;
            const c = vox.get(p[0], p[1], p[2]);
            if (c === undefined) continue;
            q[0] = p[0]; q[1] = p[1]; q[2] = p[2]; q[d] += s;
            if (vox.has(q[0], q[1], q[2])) continue;
            const k = ((cid(c) + 1) << 8) | ao(-1, -1) | (ao(1, -1) << 2) | (ao(1, 1) << 4) | (ao(-1, 1) << 6);
            emitQuad(d, u, v, s, s > 0 ? x + 1 : x, p[u], p[v], 1, 1, k);
          }
        }
      }
    }
  }
  function emitQuad(d, u, v, s, plane, u0, v0, w, h, k) {
    const base = pos.length / 3;
    const c = cols[(k >> 8) - 1];
    const a = [k & 3, (k >> 2) & 3, (k >> 4) & 3, (k >> 6) & 3];
    // Grow each quad a hair past its edges. At a step, the near face and the face behind it meet on
    // the same screen edge without sharing vertices, and pixels along that edge would otherwise fall
    // through to whatever is behind (flickering hairline cracks).
    const e = 0.012;
    const corners = [[u0 - e, v0 - e], [u0 + w + e, v0 - e], [u0 + w + e, v0 + h + e], [u0 - e, v0 + h + e]];
    for (let n = 0; n < 4; n++) {
      const vtx = [0, 0, 0];
      vtx[d] = plane; vtx[u] = corners[n][0]; vtx[v] = corners[n][1];
      pos.push(vtx[0], vtx[1], vtx[2]);
      const nv = [0, 0, 0]; nv[d] = s;
      nor.push(nv[0], nv[1], nv[2]);
      const f = AO_CURVE[a[n]];
      col.push(c.r * f, c.g * f, c.b * f);
    }
    // split along the brighter diagonal so AO doesn't streak
    const flip = a[0] + a[2] < a[1] + a[3];
    const tris = flip ? [0, 1, 3, 1, 2, 3] : [0, 1, 2, 0, 2, 3];
    if (s < 0) for (let n = 0; n < 6; n += 3) { const tmp = tris[n + 1]; tris[n + 1] = tris[n + 2]; tris[n + 2] = tmp; }
    for (const n of tris) idx.push(base + n);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('normal', new THREE.Float32BufferAttribute(nor, 3));
  g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  g.setIndex(idx);
  g.computeBoundingBox();
  return g;
}

// Draw layers. Parts attach flush to the body, so their faces can sit exactly on the same plane as
// body faces and z-fight. Each layer gets a stronger polygon offset, so where two surfaces share a
// plane the higher layer always wins: body < parts (ears, tail, feet) < face (eyes).
const LAYER = { body: 0, part: 1, face: 2 };
const VOX_MATS = [0, 1, 2].map(l => new THREE.MeshLambertMaterial({
  vertexColors: true, polygonOffset: l > 0, polygonOffsetFactor: -l, polygonOffsetUnits: -4 * l,
}));
function voxMesh(vox, { layer = LAYER.body } = {}) {
  return new THREE.Mesh(meshVox(vox), VOX_MATS[layer]);
}

// ---------------- the critter ----------------
// Colours and pattern come from the seed. Shapes come from the stage (and later, the adult form).
function makePalette(seed) {
  const r = rngFrom(hashStr('pal:' + seed));
  const h = r();
  const hsl = (hh, s, l) => new THREE.Color().setHSL(((hh % 1) + 1) % 1, s, l, THREE.SRGBColorSpace).getHex(THREE.SRGBColorSpace);
  const accentShift = [0.5, 0.42, 0.58, 0.08, -0.08][Math.floor(r() * 5)];
  return {
    body: hsl(h, 0.55 + r() * 0.2, 0.6 + r() * 0.08),
    belly: hsl(h + 0.02, 0.6, 0.86),
    accent: hsl(h + accentShift, 0.6 + r() * 0.2, 0.55),
    dark: hsl(h, 0.45, 0.4),
    blush: hsl(0.97, 0.8, 0.76),
    eye: 0x1a1a22,
    shine: 0xffffff,
    shell: hsl(h + 0.1, 0.35, 0.9),
    pattern: ['none', 'spots', 'stripes', 'socks'][Math.floor(r() * 4)],
    patternSeed: Math.floor(r() * 1e9),
  };
}

// ---------------- recipes ----------------
// A critter is a recipe: a body, plus parts plugged into sockets that the body works out from its own
// shape. Every stage is a recipe, and so is every adult form (see FORMS). Recipes are plain JSON so a
// save can keep the exact one its pet was built from.
const STAGES = {
  egg:   { body: { type: 'egg', w: 7, h: 9, d: 7 } },
  baby:  { body: { type: 'round', w: 7, h: 6, d: 6 }, ears: { type: 'nub', len: 1 }, feet: { type: 'stubby' },
           eyes: 'round', mouth: 'dot' },
  child: { body: { type: 'round', w: 8, h: 7, d: 7 }, ears: { type: 'nub', len: 2 }, tail: { type: 'curl', len: 2 },
           feet: { type: 'stubby' }, eyes: 'round', mouth: 'dot' },
  adult: { body: { type: 'round', w: 10, h: 8, d: 8 }, ears: { type: 'point', len: 3 }, tail: { type: 'curl', len: 4 },
           feet: { type: 'stubby' }, eyes: 'round', mouth: 'dot' },
};

// Body shapes: parameters for blob(). flat squashes the bottom half, fill > 1 fills out the corners,
// taper > 0 narrows the top (< 0 widens it, like a slumped blob).
const BODIES = {
  round:  { flat: 0.35, fill: 1.08, taper: 0 },
};

function blob(w, h, d, paint, { flat = 0.35, fill = 1.08, taper = 0 } = {}) {
  const vox = new Vox();
  const x0 = -Math.floor(w / 2), z0 = -Math.floor(d / 2);
  for (let x = 0; x < w; x++) for (let y = 0; y < h; y++) for (let z = 0; z < d; z++) {
    const nx = (x + 0.5 - w / 2) / (w / 2), ny = (y + 0.5 - h / 2) / (h / 2), nz = (z + 0.5 - d / 2) / (d / 2);
    const k = 1 + taper * ny;  // >0 narrows the top (eggs)
    const ny2 = ny < 0 ? ny * (1 - flat) : ny;
    if ((nx * k) ** 2 + ny2 * ny2 + (nz * k) ** 2 <= fill) vox.set(x0 + x, y, z0 + z, paint(nx, ny, nz));
  }
  return vox;
}

function patternPainter(pal, base) {
  const r = rngFrom(pal.patternSeed);
  const spots = Array.from({ length: 5 }, () => [r() * 2 - 1, r() * 1.4 - 0.2, r() * 2 - 1]);
  const stripeOff = r() * 4;
  return (nx, ny, nz) => {
    if (pal.pattern === 'spots' && spots.some(([sx, sy, sz]) => (nx - sx) ** 2 + (ny - sy) ** 2 + (nz - sz) ** 2 < 0.09)) return pal.accent;
    if (pal.pattern === 'stripes' && ny > 0.1 && nz < 0.4 && Math.floor(nx * 3.5 + stripeOff) % 2 === 0) return pal.accent;
    return base(nx, ny, nz);
  };
}

// ---------------- parts ----------------
// Small parts are drawn as rows of characters, top row first, in the x/y plane. `map` turns a
// character into a colour; '.' and ' ' are empty.
function flat(rowsTopFirst, map, z = 0) {
  const vox = new Vox(), n = rowsTopFirst.length;
  rowsTopFirst.forEach((row, r) => [...row].forEach((ch, x) => {
    if (map[ch] !== undefined) vox.set(x, n - 1 - r, z, map[ch]);
  }));
  return vox;
}
function mirrorVox(vox) {
  const out = new Vox();
  for (const [x, y, z, c] of vox.each()) out.set(-x - 1, y, z, c);
  return out;
}

// Ears / horns sit on top of the head. Each generator draws the RIGHT (+x) one, with its base at
// y = 0 around x = 0 and "inward" toward -x; the left one is a mirror image.
// motion: how the part reacts to hops. loose = floppy spring, stiff = barely moves.
const EARS = {
  nub(p, pal) {
    const vox = new Vox();
    for (let y = 0; y < p.len; y++) vox.set(0, y, 0, pal.body);
    return { vox, motion: 'loose' };
  },
  point(p, pal) {
    const vox = new Vox();
    for (let y = 0; y < p.len; y++) {
      vox.set(0, y, 0, y === p.len - 1 ? pal.accent : pal.body);
      if (y < p.len - 1) vox.set(-1, y, 0, pal.body);
    }
    return { vox, motion: 'loose' };
  },
};

// Tails leave the back of the body going toward -z, with their base voxel at the origin.
const TAILS = {
  curl(p, pal) {
    const vox = new Vox();
    for (let i = 0; i < p.len; i++) vox.set(0, Math.round(i * 0.7), -i, i === p.len - 1 ? pal.accent : pal.body);
    return { vox, motion: 'tail' };
  },
};

// Feet are built against the body grid (they need its width), and report how tall they are.
const FEET = {
  stubby(S, pal, col, mirror) {
    const vox = new Vox();
    const fw = S.w >= 9 ? 2 : 1;
    const F = Math.max(0, Math.round(S.w * 0.18));
    const c = pal.pattern === 'socks' ? pal.accent : pal.dark;
    for (const i of [F, mirror(F) - fw + 1]) {
      for (let x = 0; x < fw; x++) for (let z = 0; z < 2; z++) vox.set(col(i + x), 0, z, c);
    }
    return { vox, h: 1 };
  },
};

// Eyes: one drawing per expression, for the RIGHT eye. k = pupil, w = shine. Expressions listed in
// `mirrored` are flipped for the left eye (slanted ones); the rest are drawn the same on both sides,
// so the shine is on the same side of both eyes.
const EYES = {
  round: {
    w: 2, h: 2, mirrored: ['sad'],
    open:  ['wk', 'kk'],
    shut:  ['..', 'kk'],
    happy: ['kk', '..'],
    sad:   ['k.', '.k'],
  },
};
const EXPRESSIONS = ['open', 'shut', 'happy', 'sad'];

// Mouths are painted onto the body's front surface. Offsets are [dx, dy] from the centre column(s)
// at the mouth row: negative dx counts from the left centre column, positive from the right one.
const MOUTHS = {
  dot: { k: [[0, 0]] },
};

// How a recipe moves: bigger critters hop higher and further, and hold themselves up more firmly.
function motionFor(recipe) {
  const { w, h } = recipe.body;
  if (recipe.body.type === 'egg') return { upright: 40 };
  return { hopV: 12 + 2.5 * h, hopS: 7 + w, upright: 20 * h - 30 };
}

function buildCritter(recipe, pal) {
  const RB = recipe.body;
  const S = { w: RB.w, h: RB.h, d: RB.d, foot: 0, egg: RB.type === 'egg', ...motionFor(recipe) };
  const root = new THREE.Group();   // follows the physics body; origin at the feet
  const squash = new THREE.Group(); // squash & stretch, pivot at the feet
  root.add(squash);
  const parts = { root, squash, ears: [], tail: null, eyes: [], S };
  parts.setExpr = (name) => {
    for (const e of parts.eyes) for (const [k, m] of Object.entries(e.m)) m.visible = k === (name in e.m ? name : 'open');
  };

  if (S.egg) {
    // round slices, widest a bit below the middle
    const vox = new Vox(), r = rngFrom(pal.patternSeed);
    const spots = Array.from({ length: 9 }, () => [r() * 2 * Math.PI, 0.12 + r() * 0.66]);
    for (let y = 0; y < S.h; y++) {
      const t = (y + 0.5) / S.h * 2 - 1;
      const rad = S.w / 2 * Math.pow(Math.max(0, 1 - t * t), 0.6) * (1 - 0.2 * t) + 0.2;
      for (let x = -S.w; x < S.w; x++) for (let z = -S.d; z < S.d; z++) {
        if (Math.hypot(x + 0.5, z + 0.5) > rad) continue;
        const ang = Math.atan2(z + 0.5, x + 0.5), ty = (y + 0.5) / S.h;
        const spot = spots.some(([a, sy]) => Math.abs(wrapAngle(ang - a)) * 1.6 + Math.abs(ty - sy) * 6 < 0.5);
        vox.set(x, y, z, spot ? pal.accent : pal.shell);
      }
    }
    squash.add(voxMesh(vox));
    return parts;
  }

  // Placement works in column indices 0..w-1 and mirrors i ↔ w-1-i, so faces stay symmetric for odd
  // and even widths. col(i) turns an index into the body's x coordinate.
  const x0 = -Math.floor(S.w / 2), col = (i) => x0 + i, mirror = (i) => S.w - 1 - i;
  const bellyPaint = (nx, ny, nz) => (nz > 0.3 && ny < 0.25 && Math.abs(nx) < 0.62 ? pal.belly : pal.body);
  const body = blob(S.w, S.h, S.d, patternPainter(pal, bellyPaint), BODIES[RB.type] ?? BODIES.round);

  const feet = recipe.feet && FEET[recipe.feet.type]?.(S, pal, col, mirror);
  S.foot = feet ? feet.h : 0;
  if (feet) {
    const m = voxMesh(feet.vox, { layer: LAYER.part });
    m.position.set(S.w % 2 ? -0.5 : 0, 0, S.d % 2 ? -0.5 : 0);
    squash.add(m);
  }

  const bodyGroup = new THREE.Group();
  bodyGroup.position.set(S.w % 2 ? -0.5 : 0, S.foot, S.d % 2 ? -0.5 : 0);
  squash.add(bodyGroup);

  // Puts a part's mesh on a socket. origin is the point in the part's own voxel space that should
  // land on the socket; the returned group is the pivot that animation rotates.
  const attach = (vox, socket, origin, layer = LAYER.part, opts = {}) => {
    const g = new THREE.Group();
    g.position.set(...socket);
    const m = voxMesh(vox, { layer, ...opts });
    m.position.set(-origin[0], -origin[1], -origin[2]);
    g.add(m);
    bodyGroup.add(g);
    return g;
  };

  // face
  const E = EYES[recipe.eyes] ?? EYES.round;
  const eyeY = Math.round(S.h * 0.5) - (E.h > 2 ? 1 : 0);
  const gap = S.w % 2 ? 1 : 2;
  const L = Math.floor((S.w - 2 * E.w - gap) / 2);
  const eyeMap = { k: pal.eye, w: pal.shine };
  for (const [side, i] of [[-1, L], [1, mirror(L) - E.w + 1]]) {
    const ex = col(i);
    let fz = -99;
    for (let dx = 0; dx < E.w; dx++) for (let dy = 0; dy < E.h; dy++) fz = Math.max(fz, body.frontAt(ex + dx, eyeY + dy) ?? -99);
    // cheeks, just outside and below each eye
    const cx = side > 0 ? ex + E.w : ex - 1, cz = body.frontAt(cx, eyeY - 1);
    if (cz !== null) body.set(cx, eyeY - 1, cz, pal.blush);
    const g = new THREE.Group(), m = {};
    for (const ex2 of EXPRESSIONS) {
      if (!E[ex2]) continue;
      let rows = E[ex2];
      if (side < 0 && E.mirrored.includes(ex2)) rows = rows.map(r => [...r].reverse().join(''));
      m[ex2] = voxMesh(flat(rows, eyeMap), { layer: LAYER.face });
      m[ex2].visible = ex2 === 'open';
      g.add(m[ex2]);
    }
    g.position.set(ex, eyeY, fz + 0.75);
    g.scale.z = 0.5;
    bodyGroup.add(g);
    parts.eyes.push({ g, m });
  }
  const M = MOUTHS[recipe.mouth] ?? MOUTHS.dot;
  const cL = Math.floor((S.w - 1) / 2), cR = Math.ceil((S.w - 1) / 2);
  for (const [color, list] of [[pal.dark, M.k], [pal.shine, M.w ?? []]]) {
    for (const [dx, dy] of list) {
      for (const i of new Set(dx < 0 ? [cL + dx] : dx > 0 ? [cR + dx] : [cL, cR])) {
        const mz = body.frontAt(col(i), eyeY - 1 + dy);
        if (mz !== null) body.set(col(i), eyeY - 1 + dy, mz, color);
      }
    }
  }
  bodyGroup.add(voxMesh(body));

  // ears, on the top surface, pivoting at their base
  if (recipe.ears && EARS[recipe.ears.type]) {
    const part = EARS[recipe.ears.type](recipe.ears, pal);
    const ei = Math.max(1, Math.round(S.w * 0.2));
    for (const [side, i] of [[-1, ei], [1, mirror(ei)]]) {
      const top = body.topAt(col(i), 0) ?? S.h - 1;
      const vox = side > 0 ? part.vox : mirrorVox(part.vox);
      const g = attach(vox, [col(i) + 0.5, top + 0.6, 0.5], [side * 0.5, 0, 0.5]);
      parts.ears.push({ g, side, motion: part.motion, a: 0, v: 0 });

  // tail, from the back of the body
  if (recipe.tail && TAILS[recipe.tail.type]) {

    const ty = Math.round(S.h * 0.3), bz = body.backAt(0, ty) ?? -S.d / 2;
    const g = attach(part.vox, [0.5, ty + 0.5, bz + 0.6], [0.5, 0.5, 0.5]);
    parts.tail = { g, motion: part.motion, a: 0, v: 0 };
  }
  return parts;
}

// ---------------- renderer / scene ----------------
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, premultipliedAlpha: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(1);
renderer.setClearColor(0x000000, 0);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const cam = new THREE.OrthographicCamera(-1, 1, 1, -1, 1, 1000);
const camUp = new THREE.Vector3(0, Math.cos(PITCH), -Math.sin(PITCH));
const camBack = new THREE.Vector3(0, Math.sin(PITCH), Math.cos(PITCH));

// Light from the upper left and in front, so fronts are lit, tops are brightest and sides fall off.
scene.add(new THREE.HemisphereLight(0xfff4e8, 0x8a7aa8, 1.5));
const sun = new THREE.DirectionalLight(0xffffff, 1.8);
sun.position.set(-0.45, 0.8, 0.9);
scene.add(sun);

// 2D-style blob shadows: a flat dark ellipse facing the camera, centred on the floor line under
// each object. The object hides the top half, so only a soft smudge shows under its feet.
const SHADOW_TEX = (() => {
  const c = document.createElement('canvas');
  c.width = 64; c.height = 32;
  const g = c.getContext('2d'), gr = g.createRadialGradient(32, 16, 0, 32, 16, 32);
  gr.addColorStop(0, 'rgba(0,0,0,1)'); gr.addColorStop(0.55, 'rgba(0,0,0,.75)'); gr.addColorStop(1, 'rgba(0,0,0,0)');
  g.setTransform(1, 0, 0, 0.5, 0, 8); g.fillStyle = gr; g.fillRect(0, 0, 64, 64);
  return new THREE.CanvasTexture(c);
})();
function blobShadow() {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(1, 1),
    new THREE.MeshBasicMaterial({ map: SHADOW_TEX, transparent: true, opacity: 0.32, depthWrite: false }));
  m.renderOrder = -1;
  scene.add(m);
  return m;
}
// width w, for an object whose bottom is `height` voxels off the floor
function placeShadow(m, x, w, height) {
  const k = clamp(1 - height / 40, 0.25, 1);
  m.position.set(x, 0, 0);
  m.scale.set(w * 1.25 * k, 2.2 * k, 1);
  m.material.opacity = 0.32 * k;
}

// ---------------- physics world ----------------
await RAPIER.init();
const world = new RAPIER.World({ x: 0, y: -GRAVITY, z: 0 });
world.timestep = STEP;
const ground = world.createRigidBody(RAPIER.RigidBodyDesc.fixed());
// Collision groups: crumbs and other bits never touch Rapier, everything else sorts itself out here.
const G = { WORLD: 1, PET: 2, PROP: 4 };
const groups = (member, filter) => (member << 16) | filter;
let walls = [];
const B = { left: -50, right: 50 };  // current walls, in voxels

function layout() {
  const W = innerWidth, H = innerHeight;
  renderer.setSize(W, H);
  const hw = W / 2 / PX, hh = H / 2 / PX;
  cam.left = -hw; cam.right = hw; cam.top = hh; cam.bottom = -hh;
  // put the floor (y = 0 on the z = 0 plane everything lives in) a hair above the ground line, so the
  // blob shadows have room to show
  const shift = 0 - (-hh + CFG.ground / PX + 0.6);
  cam.position.copy(camBack).multiplyScalar(300).addScaledVector(camUp, shift);
  cam.lookAt(cam.position.clone().sub(camBack));
  cam.updateProjectionMatrix();

  B.left = -hw + CFG.xmin / 100 * W / PX;
  B.right = -hw + CFG.xmax / 100 * W / PX;
  const cx = (B.left + B.right) / 2, span = B.right - B.left;

  // bodies can't leave z = 0, so only a floor and two side walls are needed
  for (const c of walls) world.removeCollider(c, false);
  const wall = (x, y, hx, hy) => world.createCollider(
    RAPIER.ColliderDesc.cuboid(hx, hy, 20).setTranslation(x, y, 0).setFriction(0.8)
      .setCollisionGroups(groups(G.WORLD, 0xffff)), ground);
  walls = [
    wall(cx, -5, span / 2 + 50, 5),       // floor
    wall(B.left - 5, 60, 5, 80),          // left
    wall(B.right + 5, 60, 5, 80),         // right
  ];
}
layout();
addEventListener('resize', layout);
// world y of the top edge of the screen
const screenTop = () => (innerHeight - CFG.ground) / PX - 0.6;

// ---------------- the pet ----------------
const pal = makePalette(CFG.seed);
const tmpQ = new THREE.Quaternion(), tmpV = new THREE.Vector3();
// bodies only rotate about z (in the screen plane), so this is the whole rotation
const rollOf = (q) => wrapAngle(2 * Math.atan2(q.z, q.w));

class Pet {
  constructor(recipe, label, x = 0) { this.build(recipe, label, x, 30); }

  build(recipe, label, x, y) {
    if (this.vis) scene.remove(this.vis.root);
    if (this.body) world.removeRigidBody(this.body);
    this.recipe = recipe; this.stage = label;
    this.vis = buildCritter(recipe, pal);
    scene.add(this.vis.root);
    this.shadow ??= blobShadow();
    const S = this.S = this.vis.S;
    this.hx = S.w / 2; this.hy = (S.h + S.foot) / 2; this.hz = S.d / 2;
    const r = Math.min(this.hx, this.hy, this.hz) * 0.45;
    this.body = world.createRigidBody(RAPIER.RigidBodyDesc.dynamic()
      .setTranslation(x, y, 0).enabledTranslations(true, true, false).enabledRotations(false, false, true)
      .setAngularDamping(1.5).setCcdEnabled(true));
    world.createCollider(RAPIER.ColliderDesc.roundCuboid(this.hx - r, this.hy - r, this.hz - r, r)
      .setDensity(1).setFriction(0.9).setRestitution(0.05)
      .setCollisionGroups(groups(G.PET, G.WORLD | G.PROP)), this.body);
    this.inertia = this.body.mass() * (S.w * S.w + S.h * S.h) / 12;
    this.action = null; this.rethink = 0; this.scores = {}; this.cool = {}; this.timer = rand(0.5, 1.5);
    this.asleep = false; this.poseSq = 0; this.speedUp = 1; this.roll = 0;
    this.facing = 0;            // -1 left, 0 toward the camera, 1 right
    this.yaw = 0; this.yawV = 0;
    this.grounded = false; this.dazed = 0; this.crouch = 0;
    this.sq = 0; this.sqV = 0; this.lastVy = 0;
    this.blink = rand(2, 5); this.expr = 'open'; this.shownExpr = null; this.moodT = 0;
  }

  pos() { return this.body.translation(); }

  // Standing on something? Three rays across its base, so it can tell when it's resting on an edge or
  // a corner. And anything that has come to rest counts as standing, so it can never get stuck
  // leaning on something with its feet in the air.
  isGrounded(dt) {
    const p = this.pos(), v = this.body.linvel(), tilt = Math.abs(this.roll);
    let hit = false;
    for (const o of [-0.8, 0, 0.8]) {
      const reach = this.hy + 0.35 + Math.abs(o) * this.hx * Math.sin(tilt) + (o ? 0.3 : 0);
      if (world.castRay(new RAPIER.Ray({ x: p.x + o * this.hx, y: p.y, z: 0 }, { x: 0, y: -1, z: 0 }), reach, true,
        undefined, groups(G.PET, G.WORLD | G.PROP), undefined, this.body)) { hit = true; break; }
    }
    this.still = Math.hypot(v.x, v.y) < 0.6 ? (this.still ?? 0) + dt : 0;
    return hit || this.still > 0.3;
  }

  // Turning is a quick sprite-like flip between three poses, not a physical rotation.
  face(f) {
    if (f === this.facing) return;
    this.facing = f;
    this.sqV += 1.2; // little hop of the body as it turns
  }

  // physics-rate brain + controller
  step(dt) {
    const S = this.S, b = this.body, p = this.pos(), v = b.linvel();
    const wasGrounded = this.grounded;
    this.grounded = this.isGrounded(dt);
    if (this.grounded && !wasGrounded) this.sqV -= clamp(-this.lastVy * 0.045, 0, 2.2); // landing squish
    this.lastVy = v.y;

    const roll = rollOf(tmpQ.copy(b.rotation()));
    // a hard enough tip-over leaves it dazed on its side for a moment
    if (Math.abs(roll) > 1.0 && this.dazed <= 0 && !S.egg) this.dazed = 1.4;
    if (this.dazed > 0) {
      this.dazed -= dt;
      if (this.dazed <= 0 && this.grounded) b.applyImpulse({ x: 0, y: b.mass() * 18, z: 0 }, true); // scramble up
    }

    // stay upright
    b.resetTorques(false);
    if (this.dazed <= 0) {
      const kp = S.upright, kd = 2 * Math.sqrt(kp) * 0.75;
      b.addTorque({ x: 0, y: 0, z: this.inertia * (-kp * roll - kd * b.angvel().z) }, true);
    }

    if (S.egg) return this.eggStep(dt);

    this.roll = roll;
    brainStep(this, dt);
    if (this.moodT > 0 && (this.moodT -= dt) <= 0) this.expr = 'open';
  }

  // show an expression for a while
  mood(expr, secs) { this.expr = expr; this.moodT = secs; }

  // Hop toward x. Returns true once within `near` of it.
  hopToward(x, near, dt) {
    const S = this.S, b = this.body, p = this.pos(), v = b.linvel();
    const dx = x - p.x, dist = Math.abs(dx);
    if (dist <= near) { this.crouch = 0; return true; }
    if (dist > 0.5) this.face(Math.sign(dx));
    if (this.grounded && this.dazed <= 0 && Math.abs(this.roll) < 0.4) {
      this.crouch += dt;
      if (this.crouch > 0.14) {
        this.crouch = 0;
        // short distances get a small shuffle-hop instead of a full jump
        const hv = dist < 6 ? S.hopV * 0.6 : S.hopV;
        const hs = Math.min(S.hopS * this.speedUp, dist / (2 * hv / GRAVITY));
        const m = b.mass();
        b.applyImpulse({ x: m * (Math.sign(dx) * hs - v.x), y: m * (hv - v.y), z: 0 }, true);
        this.sqV += 3;
      }
    }
    return false;
  }

  eggStep(dt) {
    this.timer -= dt;
    if (this.timer <= 0 && this.grounded) {
      this.timer = rand(2, 6);
      this.body.applyTorqueImpulse({ x: 0, y: 0, z: this.inertia * rand(-2.5, 2.5) }, true);
    }
  }

  // render-rate visuals
  update(dt) {
    const b = this.body, p = this.pos(), v = b.linvel(), V = this.vis;
    tmpQ.copy(b.rotation());
    V.root.quaternion.copy(tmpQ);
    // body origin is the collider centre; the visual origin is the feet
    V.root.position.set(p.x, p.y, p.z).add(tmpV.set(0, -this.hy, 0).applyQuaternion(tmpQ));
    placeShadow(this.shadow, p.x, this.S.w, Math.max(0, p.y - this.hy));

    const ay = clamp((v.y - (this.prevVy ?? v.y)) / Math.max(dt, 1e-3), -900, 900);
    const ax = clamp((v.x - (this.prevVx ?? v.x)) / Math.max(dt, 1e-3), -900, 900);
    this.prevVy = v.y; this.prevVx = v.x;
    // resting pose (sleep, squat) plus slow breathing while asleep
    let target = this.grounded ? this.poseSq + (this.asleep ? Math.sin(performance.now() / 650) * 0.035 : 0)
      : clamp(v.y * 0.004, -0.08, 0.12);
    if (this.crouch > 0) target = -0.22;

    // The springs are stiff, so integrate them in small steps; one long frame would make them explode.
    for (let n = Math.ceil(dt / (1 / 120)), h = dt / n; n > 0; n--) {
      // turning: a snappy, slightly overshooting spring toward the facing pose
      this.yawV += ((this.facing * FACE_YAW - this.yaw) * 500 - this.yawV * 34) * h;
      this.yaw = clamp(this.yaw + this.yawV * h, -1, 1);
      // squash & stretch
      this.sqV += ((target - this.sq) * 260 - this.sqV * 14) * h;
      this.sq = clamp(this.sq + this.sqV * h, -0.4, 0.35);
      // ears and tail lag behind the body, all in the screen plane
      for (const e of V.ears) {
        e.v += (-e.a * 180 - e.v * 10 + ay * 0.004 * -e.side + ax * 0.003) * h;
        e.a = clamp(e.a + e.v * h, -0.9, 0.9);
      }
      if (V.tail) {
        const t = V.tail;
        t.v += (-t.a * 120 - t.v * 6 + ay * 0.003) * h;
        t.a = clamp(t.a + t.v * h, -1, 1);
      }
    }
    V.squash.rotation.y = this.yaw;
    const sy = 1 + this.sq, sxz = 1 / Math.sqrt(sy);
    V.squash.scale.set(sxz, sy, sxz);
    for (const e of V.ears) e.g.rotation.z = e.a;
    if (V.tail) {
      V.tail.g.rotation.x = V.tail.a;
      V.tail.g.rotation.y = Math.sin(performance.now() / 260) * 0.35; // wag
    }

    // blink
    this.blink -= dt;
    if (this.blink < -0.12) this.blink = rand(2, 5.5);
    const show = this.dazed > 0 || this.blink < 0 ? 'shut' : this.expr;
    if (show !== this.shownExpr) { V.setExpr(show); this.shownExpr = show; }
  }
}

// ---------------- props ----------------
// Physical things in the world. Each is a voxel model on a Rapier body locked to the screen plane.
const props = [];

class Prop {
  // shape: 'ball' or 'box'. fixed: true for furniture that never moves.
  constructor(kind, vox, { x, y, shape = 'ball', density = 0.3, restitution = 0.3, friction = 0.8, fixed = false, scale = 1 } = {}) {
    this.kind = kind; this.vox = vox; this.scale = scale;
    const [mn, mx] = vox.bounds();
    // centre of the model in its own voxel space; stays fixed even as bites shrink the model
    this.center = [(mn[0] + mx[0] + 1) / 2, (mn[1] + mx[1] + 1) / 2, (mn[2] + mx[2] + 1) / 2];
    this.size = [mx[0] - mn[0] + 1, mx[1] - mn[1] + 1, mx[2] - mn[2] + 1].map(v => v * scale);
    this.g = new THREE.Group();
    scene.add(this.g);
    this.rebuild();
    this.shadow = blobShadow();
    const desc = fixed ? RAPIER.RigidBodyDesc.fixed() : RAPIER.RigidBodyDesc.dynamic()
      .enabledTranslations(true, true, false).enabledRotations(false, false, true)
      .setCcdEnabled(true).setLinearDamping(0.15).setAngularDamping(0.5);
    this.body = world.createRigidBody(desc.setTranslation(x, y, 0));
    const [sx, sy, sz] = this.size;
    this.r = shape === 'ball' ? Math.max(sx, sy) / 2 * 0.92 : sy / 2;
    const cd = shape === 'ball' ? RAPIER.ColliderDesc.ball(this.r) : RAPIER.ColliderDesc.cuboid(sx / 2, sy / 2, sz / 2);
    world.createCollider(cd.setDensity(density).setRestitution(restitution).setFriction(friction)
      .setCollisionGroups(groups(G.PROP, G.WORLD | G.PET | G.PROP)), this.body);
    this.halfH = sy / 2;
    props.push(this);
  }
  rebuild() {
    if (this.mesh) { this.g.remove(this.mesh); this.mesh.geometry.dispose(); }
    this.mesh = voxMesh(this.vox);
    this.mesh.scale.setScalar(this.scale);
    this.mesh.position.set(...this.center.map(c => -c * this.scale));
    this.g.add(this.mesh);
  }
  pos() { return this.body.translation(); }
  update() {
    const p = this.pos();
    this.g.position.set(p.x, p.y, 0);
    this.g.quaternion.copy(this.body.rotation());
    placeShadow(this.shadow, p.x, this.size[0], Math.max(0, p.y - this.halfH));
  }
  remove() {
    scene.remove(this.g, this.shadow);
    world.removeRigidBody(this.body);
    props.splice(props.indexOf(this), 1);
    this.gone = true;
  }
}

// --- food ---
// Small voxel snacks. bites = how many chomps it takes to finish one; value / fun / health are how
// much the whole thing restores.
const sphereVox = (r, paint) => {
  const vox = new Vox(), n = Math.ceil(r);
  for (let x = -n; x < n; x++) for (let y = -n; y < n; y++) for (let z = -n; z < n; z++) {
    if (Math.hypot(x + 0.5, y + 0.5, z + 0.5) <= r) vox.set(x, y, z, paint(x, y, z));
  }
  return vox;
};
const FOODS = {
  apple: { bites: 4, value: 30, make() {
    const v = sphereVox(2.3, (x, y) => (y >= 1 && x < 0 ? 0xff7a6e : 0xe8433a));
    v.set(0, 2, 0, 0x7a4a2a); v.set(0, 3, 0, 0x7a4a2a); v.set(1, 3, 0, 0x5cc04a); v.set(2, 3, 0, 0x5cc04a);
    return v;
  } },
  fish: { bites: 5, value: 40, make() {
    const v = new Vox();
    for (let x = -3; x <= 2; x++) for (let y = -1; y <= 1; y++) for (let z = -1; z <= 0; z++) {
      if (Math.abs(y) === 1 && (x === -3 || x === 2)) continue;
      v.set(x, y, z, y === -1 ? 0xd6e4ef : 0x7fa8c9);
    }
    for (const y of [-2, -1, 1, 2]) v.set(3 + (Math.abs(y) === 2 ? 1 : 0), y, 0, 0x5b86ab);
    v.set(3, 0, 0, 0x5b86ab);
    v.set(-2, 0, 1, 0x1a1a22);
    return v;
  } },
  cookie: { bites: 3, value: 20, fun: 10, make() {
    const v = new Vox(), chips = [[-1, 1], [1, -1], [2, 1], [-2, -1], [0, 0]];
    for (let x = -3; x < 3; x++) for (let y = -3; y < 3; y++) {
      if (Math.hypot(x + 0.5, y + 0.5) > 3) continue;
      v.set(x, y, 0, chips.some(([cx, cy]) => cx === x && cy === y) ? 0x5a3420 : 0xd9a05b);
      v.set(x, y, -1, 0xc48a48);
    }
    return v;
  } },
  cake: { bites: 6, value: 30, fun: 25, make() {
    const v = new Vox();
    for (let x = -3; x < 3; x++) for (let z = -2; z < 2; z++) {
      for (let y = 0; y < 4; y++) v.set(x, y, z, y === 3 ? 0xffb3d1 : y === 1 ? 0xfff1c9 : 0xf3d39a);
    }
    v.set(0, 4, 0, 0xe0213f); v.set(-1, 4, 0, 0xe0213f);
    return v;
  } },
  // medicine for when it's poorly
  pill: { bites: 1, value: 0, health: 50, make() {
    const v = new Vox();
    for (let x = -2; x < 2; x++) for (let y = 0; y < 2; y++) for (let z = 0; z < 2; z++) v.set(x, y, z, x < 0 ? 0xff5d73 : 0xffffff);
    return v;
  } },
};
// The dispenser drops food in from the top of the screen.
function dropFood(kind = ['apple', 'fish', 'cookie'][Math.floor(Math.random() * 3)], x) {
  const F = FOODS[kind];
  const p = new Prop('food', F.make(), { x: x ?? rand(B.left + 10, B.right - 10), y: screenTop() + 6, density: 0.25, restitution: 0.35 });
  p.food = kind; p.bitesLeft = F.bites; p.bitesTotal = F.bites;
  p.body.setAngvel({ x: 0, y: 0, z: rand(-4, 4) }, true);
  return p;
}
// Take a bite from the side facing `fromX`. Returns false once there's nothing left.
function biteFood(food, fromX) {
  const p = food.pos(), side = Math.sign(fromX - p.x) || 1;
  const all = [...food.vox.each()];
  const n = Math.ceil(all.length / food.bitesLeft);
  // nearest voxels to the biter first: in world x, through the prop's current rotation
  const roll = rollOf(tmpQ.copy(food.body.rotation())), c = Math.cos(roll), s = Math.sin(roll);
  all.sort((a, b) => side * ((b[0] * c - b[1] * s) - (a[0] * c - a[1] * s)));
  for (const [x, y, z, col] of all.slice(0, n)) {
    food.vox.m.delete(Vox.key(x, y, z));
    if (Math.random() < 0.6) {
      spawnBits(p.x + side * food.size[0] * 0.3, p.y, [col], 1, { vx: side * rand(4, 12), vy: rand(8, 20) });
    }
  }
  food.bitesLeft--;
  if (food.bitesLeft <= 0 || food.vox.m.size === 0) { food.remove(); return false; }
  food.rebuild();
  return true;
}

// --- poop (gets swept away by the clean-up) ---
function dropPoop(x, y) {
  const v = new Vox(), c = [0x7a4f2a, 0x8d5c33];
  for (let x2 = -2; x2 < 2; x2++) for (let z = -1; z < 1; z++) v.set(x2, 0, z, c[0]);
  for (let x2 = -1; x2 < 1; x2++) for (let z = -1; z < 1; z++) v.set(x2, 1, z, c[1]);
  v.set(0, 2, 0, c[0]);
  return new Prop('poop', v, { x, y, shape: 'box', density: 0.6, restitution: 0.05, friction: 1 });
}

// --- bed: a cushion it sleeps on ---
function placeBed(x) {
  const v = new Vox();
  for (let x2 = -7; x2 < 7; x2++) for (let z = -3; z < 3; z++) {
    const edge = x2 === -7 || x2 === 6 || z === -3 || z === 2;
    v.set(x2, 0, z, pal.dark);
    if (edge) v.set(x2, 1, z, pal.accent);
  }
  return new Prop('bed', v, { x, y: 1, shape: 'box', fixed: true, friction: 1 });
}

// --- ball ---
function dropBall(x) {
  const cols = [0xff4d6d, 0xffffff, 0x3ab0ff, 0xffd23f];
  const vox = sphereVox(2.9, (a, b, c) => cols[(Math.floor(Math.atan2(c + 0.5, a + 0.5) / (Math.PI / 2) + 4)) % 4]);
  return new Prop('ball', vox, { x: x ?? rand(B.left + 10, B.right - 10), y: screenTop() + 6,
    density: 0.12, restitution: 0.65, friction: 0.6, scale: 2.2 / 2.9 });
}

// ---------------- bits: crumbs, sparkles, Zzz ----------------
// Hundreds of tiny cubes in one instanced mesh. They don't need Rapier: they live in the screen plane
// and only have to bounce off the floor and walls, so they get a few lines of physics of their own.
const BITS_MAX = 400;
const bitsMesh = new THREE.InstancedMesh(new THREE.BoxGeometry(1, 1, 1), new THREE.MeshLambertMaterial(), BITS_MAX);
bitsMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
bitsMesh.count = 0;
bitsMesh.frustumCulled = false;
scene.add(bitsMesh);
const bits = [];
// opts: vx, vy (base velocity), spread, size, life, grav (1 = normal, 0 = floats), z
function spawnBits(x, y, colors, n, opts = {}) {
  const { vx = 0, vy = 10, spread = 8, size = 0.55, life = 2.5, grav = 1, z = 0 } = opts;
  for (let i = 0; i < n && bits.length < BITS_MAX; i++) {
    bits.push({
      x, y, z: z + rand(-0.5, 0.5), vx: vx + rand(-spread, spread), vy: vy + rand(-spread, spread) * 0.5,
      a: rand(0, 6), va: rand(-10, 10), s: size * rand(0.8, 1.2), life: life * rand(0.8, 1.2), age: 0, grav,
      color: new THREE.Color(colors[Math.floor(Math.random() * colors.length)]),

  }
}
const bitM = new THREE.Matrix4(), bitQ = new THREE.Quaternion(), bitE = new THREE.Euler(), bitS = new THREE.Vector3(), bitP = new THREE.Vector3();
function updateBits(dt) {
  for (let i = bits.length - 1; i >= 0; i--) {
    const b = bits[i];
    b.age += dt;
    if (b.age >= b.life) { bits.splice(i, 1); continue; }
    b.vy -= GRAVITY * b.grav * dt;
    if (b.grav === 0) { b.vx *= 1 - dt * 1.5; b.vy *= 1 - dt * 1.5; }
    b.x += b.vx * dt; b.y += b.vy * dt; b.a += b.va * dt;
    if (b.y < b.s / 2 && b.grav > 0) { b.y = b.s / 2; b.vy = Math.abs(b.vy) * 0.35; b.vx *= 0.6; b.va *= 0.6; }
    if (b.x < B.left) { b.x = B.left; b.vx = Math.abs(b.vx) * 0.5; }
    if (b.x > B.right) { b.x = B.right; b.vx = -Math.abs(b.vx) * 0.5; }
  }
  bitsMesh.count = bits.length;
  bits.forEach((b, i) => {
    const k = b.s * Math.min(1, (b.life - b.age) * 3);  // shrink away at the end
    bitM.compose(bitP.set(b.x, b.y, b.z), bitQ.setFromEuler(bitE.set(0, 0, b.a)), bitS.set(k, k, k));
    bitsMesh.setMatrixAt(i, bitM);
    bitsMesh.setColorAt(i, b.color);

}
const SPARKLE = [0xffffff, 0xfff3a0, 0xa8f0ff];

// ---------------- life: needs ----------------
// Needs run from 0 (desperate) to 100 (perfectly happy) and fall over time. The overlay is the
// caretaker, so the brain always finds a way to fix them; how well that goes shapes it later.
const life = {
  needs: { hunger: 75, energy: 85, fun: 65, hygiene: 95, social: 60 },
  health: 100,
  digestAt: 0,  // life-clock time the next poop is due (0 = nothing to digest)
  t: 0,         // life clock in seconds (runs at ?speed)
};
const N = life.needs;
const DECAY = { hunger: 40, energy: 22, fun: 55, hygiene: 6, social: 35 }; // points per hour, awake
for (const kv of (Q.get('set') || '').split(',')) {        // ?set=hunger:10,energy:5 for testing
  const [k, v] = kv.split(':');
  if (k in N) N[k] = clamp(+v, 0, 100); else if (k === 'health') life.health = clamp(+v, 0, 100);
}

function tickLife(dt) {
  const h = dt * CFG.speed / 3600;
  life.t += dt * CFG.speed;
  const asleep = pet.asleep;
  for (const k in DECAY) N[k] -= DECAY[k] * h * (asleep ? (k === 'energy' ? 0 : 0.35) : 1);
  if (asleep) N.energy += 70 * h;
  N.hygiene -= 25 * h * props.filter(p => p.kind === 'poop').length;
  for (const k in N) N[k] = clamp(N[k], 0, 100);
  // health only suffers if a body need is badly neglected, and recovers slowly otherwise. (Social is
  // about mood, and chat is the only thing that fills it, so it never makes the pet ill.)
  const low = N.hunger < 12 || N.energy < 12 || N.hygiene < 12;
  life.health = clamp(life.health + (low ? -25 : 6) * h, 0, 100);
}

// Night hours (local time) make it want to sleep. ?night=1-7 by default, ?night=off to never.
const NIGHT = (() => {
  const v = Q.get('night') ?? '1-7';
  const m = /^(\d+)-(\d+)$/.exec(v);
  return m ? [+m[1] % 24, +m[2] % 24] : null;
})();
function isNight() {
  if (!NIGHT) return false;
  const h = new Date().getHours(), [a, b] = NIGHT;
  return a <= b ? h >= a && h < b : h >= a || h < b;
}

// ---------------- brain: utility AI ----------------
// Every half second each action scores how much it wants to run (roughly 0..1) from the needs, and the
// best one wins. The running action gets a bonus so it doesn't flip-flop, and some have a minimum
// time. An action's step() returns true when it's finished; `cool` keeps it from being picked again
// for that many seconds after it ends.
const want = (v, from) => clamp((from - v) / from, 0, 1);
const findProp = (kind, near) => {
  let best = null, bd = Infinity;
  for (const p of props) {
    if (p.kind !== kind || (kind === 'food' && p.food === 'pill')) continue;
    const d = Math.abs(p.pos().x - near);

};
const spotNear = (x, off) => clamp(x + off, B.left + 8, B.right - 8);

// Shared by eat and sick: hop next to the food and chomp until it's gone.
function eatStep(p, dt, a) {
  const food = a.food, px = p.pos().x;
  if (!food || food.gone) { p.mood('happy', 1.6); return true; }
  const fp = food.pos();
  if (fp.y > food.halfH + 3 && food.body.linvel().y < -1) { p.face(Math.sign(fp.x - px)); return; } // falling: watch it
  const side = Math.sign(px - fp.x) || 1;
  if (p.hopToward(fp.x + side * (p.hx + food.size[0] / 2 + 0.3), 1.2, dt)) {
    p.face(-side);
    a.chomp = (a.chomp ?? 0.2) - dt;
    if (a.chomp <= 0 && p.grounded) {
      a.chomp = 0.45;
      p.sqV -= 2.2;
      const F = FOODS[food.food];
      N.hunger = clamp(N.hunger + F.value / F.bites, 0, 100);
      if (F.fun) N.fun = clamp(N.fun + F.fun / F.bites, 0, 100);
      if (F.health) life.health = clamp(life.health + F.health / F.bites, 0, 100);
      if (F.value && !life.digestAt) life.digestAt = life.t + rand(600, 1500);
      biteFood(food, px);
    }
  }
}

const ACTIONS = {
  idle: {
    score: () => 0.16,
    start(p, a) { a.until = rand(3, 8); a.glance = rand(0.5, 2); },
    step(p, dt, a) {
      // face the camera, with the odd glance to one side
      if ((a.glance -= dt) <= 0) {
        p.face(p.facing === 0 && Math.random() < 0.4 ? (Math.random() < 0.5 ? -1 : 1) : 0);
        a.glance = p.facing ? rand(0.6, 1.4) : rand(1.5, 4);
      }
      return a.t > a.until;
    },
  },
  wander: {
    score: () => 0.17,
    start(p, a) {
      const x = p.pos().x, m = p.hx + 2;
      a.x = Math.random() < 0.6 ? clamp(x + rand(-30, 30), B.left + m, B.right - m) : rand(B.left + m, B.right - m);
    },
    step: (p, dt, a) => p.hopToward(a.x, 2, dt) || a.t > 20,
  },
  eat: {
    bubble: '🍎',
    score: () => want(N.hunger, 55) ** 0.7 * 1.15 + (findProp('food', 0) && N.hunger < 85 ? 0.3 : 0),
    start(p, a) {
      const x = p.pos().x;
      a.food = findProp('food', x) ?? dropFood(undefined, spotNear(x, (p.facing || (Math.random() < 0.5 ? -1 : 1)) * rand(10, 16)));
    },
    step: (p, dt, a) => eatStep(p, dt, a) || a.t > 30,
  },
  sick: {
    bubble: '🤒',
    score: () => (life.health < 35 ? 1.3 : 0),
    start(p, a) { a.food = dropFood('pill', spotNear(p.pos().x, rand(-10, 10))); p.expr = 'sad'; },
    step: (p, dt, a) => eatStep(p, dt, a) || a.t > 30,
    end(p) { p.expr = 'open'; },
  },
  sleep: {
    bubble: '💤', minTime: 20,
    score: () => want(N.energy, 35) * 1.1 + (isNight() && N.energy < 75 ? 0.45 : 0) + (pet.asleep && isNight() ? 0.5 : 0),
    start(p, a) { a.z = 0; },
    step(p, dt, a) {

          p.asleep = true; p.face(0); p.poseSq = -0.18; p.expr = 'shut';
        }
        return a.t > 25 && !p.asleep;
      }
      if ((a.z -= dt) <= 0) {
        a.z = 1.3;
        const q = p.pos();
        floatText(q.x + p.hx * 0.6, q.y + p.hy + 1, 'z', 'zzz');
      }
      return N.energy >= 99 && !isNight();
    },
    end(p) { p.asleep = false; p.poseSq = 0; p.expr = 'open'; p.sqV += 3; }, // and a stretch
  },
  play: {
    bubble: '⚽', cool: 8,
    score: () => want(N.fun, 50) * 0.85,
    start(p, a) {
      a.ball = findProp('ball', p.pos().x) ?? dropBall(spotNear(p.pos().x, rand(-15, 15)));
      a.until = rand(15, 30);
    },
    step(p, dt, a) {
      const ball = a.ball;

      // Kick it away from the side it's on, or out of a corner toward the middle. The direction is
      // picked once per kick so the pet doesn't dither between sides.
      if (!a.dir) {

      }

      if (close && p.grounded && (a.kickT = (a.kickT ?? 0) - dt) <= 0) {
        p.face(a.dir);
        const m = ball.body.mass();
        ball.body.applyImpulse({ x: a.dir * m * rand(25, 45), y: m * rand(15, 40), z: 0 }, true);
        p.sqV += 2;

        a.dir = 0; a.kickT = 0.6;
      } else if (!close && bp.y < ball.r + 4) {
        p.hopToward(clamp(bp.x - a.dir * reach, B.left + p.hx, B.right - p.hx), 1.6, dt);
      }

    },
  },
  zoomies: {
    bubble: '❗', cool: 30,
    score: () => (N.fun > 60 && N.energy > 55 ? 0.1 : 0) + (life.hype ?? 0),
    start(p, a) {
      const x = p.pos().x;
      a.xs = [spotNear(x, 22), spotNear(x, -22)];
      if (Math.random() < 0.5) a.xs.reverse();

      p.expr = 'happy'; p.speedUp = 1.6;

    step(p, dt, a) {

      return a.leg >= a.legs || a.t > 15;
    },
    end(p) { p.expr = 'open'; p.speedUp = 1; N.fun = clamp(N.fun + 10, 0, 100); life.hype = 0; },
  },
  clean: {

    score: () => (findProp('poop', 0) ? 0.4 + want(N.hygiene, 60) * 0.5 : want(N.hygiene, 30) * 0.7),
    start(p, a) {

  poop: {

    start(p) { p.poseSq = -0.3; p.expr = 'shut'; p.face(0); },

function brainStep(p, dt) {
  const cur = p.action;
  let done = false;
  if (cur) { cur.t += dt; done = cur.def.step(p, dt, cur) === true; }
  if (!done && (p.rethink -= dt) > 0) return;
  p.rethink = 0.5;
  let best = null, bestScore = -1;
  p.scores = {};
  for (const [name, def] of Object.entries(ACTIONS)) {
    let s = def.score(p) + Math.random() * 0.04 - (p.cool[name] > life.t ? 0.5 : 0);
    if (cur && !done && name === cur.name) s += 0.2; // stick with what it's doing
    p.scores[name] = s;
    if (s > bestScore) { bestScore = s; best = name; }
  }
  const mustFinish = cur && !done && cur.t < (cur.def.minTime ?? 0);
  if (!mustFinish && (done || best !== cur?.name)) startAction(p, best);
}
function startAction(p, name) {
  if (p.action) {
    p.action.def.end?.(p, p.action);
    p.cool[p.action.name] = life.t + (p.action.def.cool ?? 0) * CFG.speed; // a short rest from it
  }
  const def = ACTIONS[name], a = { name, def, t: 0 };
  p.action = a;
  def.start?.(p, a);
  if (def.bubble) showBubble(def.bubble);

// ---------------- broom ----------------
// The auto-clean: a little broom drops in next to the poop, sweeps a few times and it's gone.
const effects = [];
function sweepAway(poop) {
  const v = new Vox();
  for (let y = 3; y < 11; y++) v.set(0, y, 0, 0x9a6a3a);              // handle
  for (let x = -2; x <= 2; x++) for (let y = 0; y < 3; y++) v.set(x, y, 0, y === 2 ? 0xb03a2e : 0xf2c14e);
  const g = new THREE.Group(), m = voxMesh(v);
  m.position.set(-0.5, 0, -0.5);
  g.add(m);
  scene.add(g);
  const fx = { done: false, t: 0, g, poop, side: Math.random() < 0.5 ? -1 : 1 };
  fx.step = (dt) => {
    fx.t += dt;
    const pp = poop.gone ? fx.last : poop.pos();
    fx.last = pp;
    const pop = Math.min(1, fx.t * 5), out = fx.t > 2.2 ? Math.max(0, 1 - (fx.t - 2.2) * 5) : 1;
    g.scale.setScalar(pop * out * 0.8);
    const swish = Math.sin(fx.t * 14);
    g.position.set(pp.x + fx.side * (3 + swish * 1.5), 0.2, 1.5);
    g.rotation.z = fx.side * (0.5 + swish * 0.35);
    if (fx.t > 0.4 && Math.random() < 0.3) spawnBits(pp.x, 0.5, [0xd8c8a8], 1, { vx: -fx.side * 6, vy: 6, size: 0.35, life: 0.6 });
    if (fx.t > 1.8 && !poop.gone) {
      spawnBits(pp.x, 1.5, SPARKLE, 14, { vy: 10, spread: 10, size: 0.45, life: 1.2, grav: 0 });
      poop.remove();
    }
    if (fx.t > 2.4) { scene.remove(g); fx.done = true; }
  };
  effects.push(fx);
  return fx;
}
function stepEffects(dt) {
  for (let i = effects.length - 1; i >= 0; i--) { effects[i].step(dt); if (effects[i].done) effects.splice(i, 1); }
}

// ---------------- bubbles and floating text (DOM, over the canvas) ----------------
const projV = new THREE.Vector3();
function toScreen(x, y) {
  projV.set(x, y, 0).project(cam);
  return [(projV.x + 1) / 2 * innerWidth, (1 - projV.y) / 2 * innerHeight];
}
const bubbleEl = document.getElementById('bubble');
let bubbleUntil = 0;
function showBubble(icon) {
  bubbleEl.textContent = icon;
  bubbleEl.classList.remove('show'); void bubbleEl.offsetWidth; bubbleEl.classList.add('show');
  bubbleUntil = performance.now() + 2600;
}
function placeBubble() {
  if (performance.now() > bubbleUntil) { bubbleEl.classList.remove('show'); return; }
  const q = pet.pos(), [sx, sy] = toScreen(q.x + pet.hx * 0.4, q.y + pet.hy + 2);
  bubbleEl.style.transform = `translate(${sx.toFixed(1)}px, ${sy.toFixed(1)}px)`;
}
function floatText(x, y, text, cls) {
  const el = document.createElement('div');
  el.className = 'float ' + (cls || '');
  el.textContent = text;
  const [sx, sy] = toScreen(x, y);
  el.style.left = sx + 'px'; el.style.top = sy + 'px';
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 2600);
}

// ---------------- loop ----------------
const pet = new Pet(STAGES[CFG.stage], CFG.stage, (B.left + B.right) / 2);
placeBed(B.left + 14);
if (CFG.ball) dropBall();
function dropThing(kind = 'ball') {
  if (kind === 'ball') dropBall();
  else if (kind === 'poop') dropPoop(pet.pos().x + (pet.facing ? -pet.facing * 6 : 6), 10);
  else if (kind === 'food' || FOODS[kind]) dropFood(FOODS[kind] ? kind : undefined);
}
for (const k of (Q.get('drop') || '').split(',').filter(Boolean)) dropThing(k);

let debugLines = null;
if (CFG.debug) {
  debugLines = new THREE.LineSegments(new THREE.BufferGeometry(),
    new THREE.LineBasicMaterial({ vertexColors: true, depthTest: false }));
  debugLines.renderOrder = 99;
  scene.add(debugLines);
}
const hud = document.getElementById('hud');

function stepSim(dt) {
  if (!pet.S.egg) tickLife(dt);
  pet.step(dt);
  stepEffects(dt);
  world.step();
  // anything that escaped the walls comes back in from above
  for (const pr of [pet, ...props]) {
    if (pr.body.isFixed()) continue;
    const p = pr.body.translation();
    if (p.y < -30 || p.x < B.left - 5 || p.x > B.right + 5) {
      pr.body.setTranslation({ x: clamp(p.x, B.left + 8, B.right - 8), y: 40, z: 0 }, true);
      pr.body.setLinvel({ x: 0, y: 0, z: 0 }, true);
    }
  }
}

// ?settle=N runs N seconds of simulation up front (screenshots, headless tests)
for (let i = 0, n = num('settle', 0, 0, 600) / STEP; i < n; i++) { stepSim(STEP); if (i % 4 === 0) pet.update(STEP * 4); }

let hidden = document.hidden, last = performance.now(), acc = 0, fps = 0;
function setHidden(h) {
  hidden = h;
  // the time spent hidden goes to the life simulation later, never to the physics
  last = performance.now(); acc = 0;
}
document.addEventListener('visibilitychange', () => setHidden(document.hidden));
addEventListener('obsSourceVisibleChanged', e => setHidden(!(e.detail && e.detail.visible)));

function frame(now) {
  requestAnimationFrame(frame);
  if (hidden) return;
  const dt = Math.min(0.1, (now - last) / 1000);
  last = now;
  fps += ((dt > 0 ? 1 / dt : 60) - fps) * 0.05;
  acc += dt;
  let n = 0;
  while (acc >= STEP && n < 6) { stepSim(STEP); acc -= STEP; n++; }
  if (n === 6) acc = 0;

  pet.update(dt);
  for (const pr of props) pr.update();
  updateBits(dt);
  placeBubble();
  if (debugLines) {
    const { vertices, colors } = world.debugRender();
    debugLines.geometry.setAttribute('position', new THREE.BufferAttribute(vertices, 3));
    debugLines.geometry.setAttribute('color', new THREE.BufferAttribute(colors, 4));
    const p = pet.pos();
    hud.textContent = `fps ${fps.toFixed(0)}\n` +
      `stage ${pet.stage}  seed ${CFG.seed}  pattern ${pal.pattern}\n` +
      `action ${pet.action?.name}  grounded ${pet.grounded}  dazed ${pet.dazed > 0}  asleep ${pet.asleep}\n` +
      `needs ${Object.entries(N).map(([k, v]) => k + ' ' + v.toFixed(0)).join('  ')}  health ${life.health.toFixed(0)}\n` +
      `wants ${Object.entries(pet.scores).sort((a, b) => b[1] - a[1]).map(([k, v]) => k + ' ' + v.toFixed(2)).join('  ')}\n` +
      `pos ${p.x.toFixed(1)}, ${p.y.toFixed(1)}, ${p.z.toFixed(1)}  walls ${B.left.toFixed(0)}..${B.right.toFixed(0)}`;
  }
  renderer.render(scene, cam);
}
requestAnimationFrame(frame);

// ---------------- testing API ----------------
window.pet = {
  hop() { startAction(pet, 'wander'); },
  do(name) { if (ACTIONS[name]) startAction(pet, name); },
  set(k, v) { if (k in N) N[k] = clamp(v, 0, 100); else if (k === 'health') life.health = clamp(v, 0, 100); },
  needs: () => ({ ...N, health: life.health }),
  knock(power = 1) {
    const b = pet.body, m = b.mass(), s = Math.random() < 0.5 ? -1 : 1;
    b.applyImpulse({ x: m * 25 * s * power, y: m * 30 * power, z: 0 }, true);
    b.applyTorqueImpulse({ x: 0, y: 0, z: -s * pet.inertia * 9 * power }, true);
  },
  drop: dropThing,
  stage(s) { if (STAGES[s]) { const p = pet.pos(); pet.build(STAGES[s], s, p.x, p.y + 6); } },
  expr(e) { pet.expr = e; },
};
</script>
