}
function runLineup(ids) {
  const seed = Q.get('seed') || 'gallery';
  const items = ids.map(id => STAGES[id] ? { recipe: STAGES[id], pal: withPartColours(makePalette(seed + id)) }
    : formById(id) && { recipe: formById(id).recipe, pal: galleryPalette(formById(id).recipe, seed) }).filter(Boolean);
  const W = innerWidth, H = innerHeight, GAP = 17, px = Math.min(W / (items.length * GAP), H / 16);
  renderer.setSize(W, H);
  const lcam = new THREE.OrthographicCamera(-W / 2 / px, W / 2 / px, H / px - 2, -2, 1, 1000);
  lcam.position.set(0, 0, 300);
  items.forEach((it, i) => {
    const parts = buildCritter(it.recipe, it.pal);
    parts.root.position.set((i - (items.length - 1) / 2) * GAP, 0, 0);
    parts.root.rotation.x = PITCH;
    parts.squash.rotation.y = (i % 2 ? -1 : 1) * 0.3;
    scene.add(parts.root);
    const sh = blobShadow();
    placeShadow(sh, parts.root.position.x, parts.S.w, 0);
  });
  renderer.render(scene, lcam);
}

if (Q.get('gallery') === '1') {
  runGallery();
  await new Promise(() => {}); // the gallery is all this page does; stop here
}

// ---------------- physics world ----------------
await RAPIER.init();
const world = new RAPIER.World({ x: 0, y: -GRAVITY, z: 0 });
world.timestep = STEP;
const ground = world.createRigidBody(RAPIER.RigidBodyDesc.fixed());
// Collision groups: crumbs and other bits never touch Rapier, everything else sorts itself out here.
const G = { WORLD: 1, PET: 2, PROP: 4, WALL: 8 };
const groups = (member, filter) => (member << 16) | filter;
let walls = [];
const B = { left: -50, right: 50 };  // current walls, in voxels

function layout() {
  const W = innerWidth, H = innerHeight;
  renderer.setSize(W, H);
  const hw = W / 2 / PX, hh = H / 2 / PX;
  cam.left = -hw; cam.right = hw; cam.top = hh; cam.bottom = -hh;
  // put the floor (y = 0 on the z = 0 plane everything lives in) a hair above the ground line, so the
  // blob shadows have room to show
  const shift = 0 - (-hh + CFG.ground / PX + 0.6);
  cam.position.copy(camBack).multiplyScalar(300).addScaledVector(camUp, shift);
  cam.lookAt(cam.position.clone().sub(camBack));
  cam.updateProjectionMatrix();
  cam.updateMatrixWorld(); // now, not at the first render, so screen positions are right straight away

  B.left = -hw + CFG.xmin / 100 * W / PX;
  B.right = -hw + CFG.xmax / 100 * W / PX;
  const cx = (B.left + B.right) / 2, span = B.right - B.left;

  // bodies can't leave z = 0, so only a floor and two side walls are needed
  for (const c of walls) world.removeCollider(c, false);
  const wall = (x, y, hx, hy, g) => world.createCollider(
    RAPIER.ColliderDesc.cuboid(hx, hy, 20).setTranslation(x, y, 0).setFriction(0.8)
      .setCollisionGroups(groups(g, 0xffff)), ground);
  walls = [
    wall(cx, -5, span / 2 + 80, 5, G.WORLD),  // floor (runs on past the walls, for a pet that's leaving)
    wall(B.left - 5, 60, 5, 80, G.WALL),      // left
    wall(B.right + 5, 60, 5, 80, G.WALL),     // right
  ];
}
layout();
addEventListener('resize', layout);
// world y of the top edge of the screen
const screenTop = () => (innerHeight - CFG.ground) / PX - 0.6;

// ---------------- the pet ----------------
const tmpQ = new THREE.Quaternion(), tmpV = new THREE.Vector3();
// bodies only rotate about z (in the screen plane), so this is the whole rotation
const rollOf = (q) => wrapAngle(2 * Math.atan2(q.z, q.w));

// spring stiffness, damping, how much hops move it, max angle, for each kind of part motion
const SPRINGS = { loose: [180, 10, 1, 0.9], stiff: [600, 30, 0.25, 0.25], tail: [120, 6, 0.8, 1], wing: [0], flicker: [0] };
const HOVER = 2.5; // how high floaty bodies hover, in voxels
const DOWN = new RAPIER.Ray({ x: 0, y: 0, z: 0 }, { x: 0, y: -1, z: 0 }); // reused for ground checks

class Pet {
  // A new pet appears standing on the floor in a puff of smoke.
  constructor(recipe, label, x = 0) {
    this.build(recipe, label, x, null);
    this.appear = 0;
    smokePuff(x, this.hy, this.hx * 2, this.hy * 2);
    sfx('poof');
  }

  build(recipe, label, x, y) {
    if (this.vis) scene.remove(this.vis.root);
    if (this.body) world.removeRigidBody(this.body);
    this.recipe = recipe; this.stage = label;
    this.vis = buildCritter(recipe, pal);
    scene.add(this.vis.root);
    this.shadow ??= blobShadow();
    const S = this.S = this.vis.S;
    this.hx = S.w / 2; this.hy = (S.h + S.foot) / 2; this.hz = S.d / 2;
    const r = Math.min(this.hx, this.hy, this.hz) * 0.45;
    this.body = world.createRigidBody(RAPIER.RigidBodyDesc.dynamic()
      // y = null: standing on the floor (or hovering, for floaty bodies)
      .setTranslation(x, y ?? this.hy + 0.02 + (S.hover ? HOVER : 0), 0).enabledTranslations(true, true, false).enabledRotations(false, false, true)
      .setAngularDamping(1.5).setCcdEnabled(true));
    world.createCollider(RAPIER.ColliderDesc.roundCuboid(this.hx - r, this.hy - r, this.hz - r, r)
      .setDensity(S.mass ?? 1).setFriction(0.9).setRestitution(0.05)
      .setCollisionGroups(groups(G.PET, G.WORLD | G.WALL | G.PROP)), this.body);
    this.inertia = this.body.mass() * (S.w * S.w + S.h * S.h) / 12;
    this.action = null; this.rethink = 0; this.scores = {}; this.cool = {}; this.timer = rand(0.5, 1.5);
    this.asleep = false; this.poseSq = 0; this.speedUp = 1; this.roll = 0;
    this.frozen = false; this.spin = 0; this.leaving = false;  // cutscenes
    this.facing = 0;            // -1 left, 0 toward the camera, 1 right
    this.yaw = 0; this.yawV = 0;
    this.grounded = false; this.dazed = 0; this.crouch = 0;
    this.sq = 0; this.sqV = 0; this.lastVy = 0;
    this.blink = rand(2, 5); this.expr = 'open'; this.shownExpr = null; this.moodT = 0;
  }

  pos() { return this.body.translation(); }

  // Standing on something? Three rays across its base, so it can tell when it's resting on an edge or
  // a corner. And anything that has come to rest counts as standing, so it can never get stuck
  // leaning on something with its feet in the air.
  isGrounded(dt) {
    const p = this.pos(), v = this.body.linvel(), tilt = Math.abs(this.roll);
    let hit = false;
    for (const o of [-0.8, 0, 0.8]) {
      const reach = this.hy + 0.35 + Math.abs(o) * this.hx * Math.sin(tilt) + (o ? 0.3 : 0) + (this.S.hover ? HOVER + 1 : 0);
      DOWN.origin = { x: p.x + o * this.hx, y: p.y, z: 0 };
      if (world.castRay(DOWN, reach, true,
        undefined, groups(G.PET, G.WORLD | G.PROP), undefined, this.body)) { hit = true; break; }
    }
    this.still = Math.hypot(v.x, v.y) < 0.6 ? (this.still ?? 0) + dt : 0;
    return hit || this.still > 0.3;
  }

  // Turning is a quick sprite-like flip between three poses, not a physical rotation.
  face(f) {
    if (f === this.facing) return;
    this.facing = f;
    this.sqV += 1.2; // little hop of the body as it turns
  }

  // physics-rate brain + controller
  step(dt) {
    const S = this.S, b = this.body, p = this.pos(), v = b.linvel();
    const wasGrounded = this.grounded;
    this.grounded = this.isGrounded(dt);
    if (this.grounded && !wasGrounded) this.sqV -= clamp(-this.lastVy * 0.045, 0, 2.2); // landing squish
    this.lastVy = v.y;

    const roll = rollOf(tmpQ.copy(b.rotation()));
    // a hard enough tip-over leaves it dazed on its side for a moment
    if (Math.abs(roll) > 1.0 && this.dazed <= 0 && !S.egg) this.dazed = 1.4;
    if (this.dazed > 0) {
      this.dazed -= dt;
      if (this.dazed <= 0) {
        if (this.grounded) this.rightItself(roll, 1.2); // scramble up
        else this.dazed = 0.3;                          // not on anything yet: try again in a moment
      }
    }
    // Propped up at an angle (on a ball, the bed's edge, poop, a wall) where the upright push can't
    // lift it off: after half a second it does a little hop to pop itself level, so it never gets stuck.
    this.leanT = Math.abs(roll) > 0.35 && this.dazed <= 0 && !S.egg ? (this.leanT ?? 0) + dt : 0;
    if (this.leanT > 0.5 && this.grounded) { this.leanT = 0; this.rightItself(roll, 0.7); }

    // floaty bodies hover a little way up on a spring instead of standing
    if (S.hover) {
      DOWN.origin = p;
      const hit = world.castRay(DOWN, 30, true, undefined,
        groups(G.PET, G.WORLD | G.PROP), undefined, b);
      const gap = hit ? hit.timeOfImpact - this.hy : 30;
      if (gap < HOVER + 3) {
        const m = b.mass(), bob = Math.sin(performance.now() / 600) * 0.4;
        b.applyImpulse({ x: 0, y: m * dt * (GRAVITY + 60 * (HOVER + bob - gap) - 8 * v.y), z: 0 }, true);
      }
    }
    // wings: glide down gently
    if (S.glide) {
      const g = !this.grounded && v.y < 0 ? 0.4 : 1;
      if (b.gravityScale() !== g) b.setGravityScale(g, true);
    }

    // stay upright
    b.resetTorques(false);
    if (this.dazed <= 0) {
      const kp = S.upright, kd = 2 * Math.sqrt(kp) * 0.75;
      b.addTorque({ x: 0, y: 0, z: this.inertia * (-kp * roll - kd * b.angvel().z) }, true);
    }

    if (S.egg) return this.eggStep(dt);

    this.roll = roll;
    if (!this.frozen) brainStep(this, dt);
    if (this.moodT > 0 && (this.moodT -= dt) <= 0) this.expr = 'open';
  }

  // A hop up and away from whatever it's leaning on, with a twist back toward level.
  rightItself(roll, power) {
    const b = this.body, m = b.mass(), lean = Math.sign(roll) || 1; // +roll = top tipped to the left
    b.applyImpulse({ x: lean * m * 6 * power, y: m * this.S.hopV * 0.7 * power, z: 0 }, true);
    b.applyTorqueImpulse({ x: 0, y: 0, z: -roll * this.inertia * 5 * power }, true);
    this.sqV += 2;
  }

  // show an expression for a while
  mood(expr, secs) { this.expr = expr; this.moodT = secs; }

  // Hop toward x. Returns true once within `near` of it.
  hopToward(x, near, dt) {
    const S = this.S, b = this.body, p = this.pos(), v = b.linvel();
    const dx = x - p.x, dist = Math.abs(dx);
    if (dist <= near) { this.crouch = 0; return true; }
    if (dist > 0.5) this.face(Math.sign(dx));
    if (this.grounded && this.dazed <= 0 && Math.abs(this.roll) < 0.7) {
      this.crouch += dt;
      if (this.crouch > 0.14) {
        this.crouch = 0;
        // short distances get a small shuffle-hop instead of a full jump
        const hv = dist < 6 ? S.hopV * 0.6 : S.hopV;
        const hs = Math.min(S.hopS * this.speedUp, dist / (2 * hv / GRAVITY));
        const m = b.mass();
        b.applyImpulse({ x: m * (Math.sign(dx) * hs - v.x), y: m * (hv - v.y), z: 0 }, true);
        if (Math.abs(this.roll) > 0.15) b.applyTorqueImpulse({ x: 0, y: 0, z: -this.roll * this.inertia * 3 }, true); // and level out
        this.sqV += 3;
        sfx('hop');
      }
    }
    return false;
  }

  eggStep(dt) {
    this.timer -= dt;
    if (this.timer <= 0 && this.grounded) {
      this.timer = rand(2, 6);
      this.body.applyTorqueImpulse({ x: 0, y: 0, z: this.inertia * rand(-2.5, 2.5) }, true);
    }
  }

  // render-rate visuals
  update(dt) {
    const b = this.body, p = this.pos(), v = b.linvel(), V = this.vis;
    tmpQ.copy(b.rotation());
    V.root.quaternion.copy(tmpQ);
    // body origin is the collider centre; the visual origin is the feet
    V.root.position.set(p.x, p.y, p.z).add(tmpV.set(0, -this.hy, 0).applyQuaternion(tmpQ));
    // asleep on its bed it sinks into the cushion a little (just the look; the body stays on top)
    const onBed = this.asleep && props.some(pr => pr.kind === 'bed' && Math.abs(pr.pos().x - p.x) < pr.size[0] / 2);
    this.sink = (this.sink ?? 0) + ((onBed ? 1.3 : 0) - (this.sink ?? 0)) * Math.min(1, dt * 3);
    V.root.position.y -= this.sink;
    // popping in: grows from nothing with a little overshoot, hidden in the smoke at first
    if (this.appear < 1) {
      this.appear = Math.min(1, this.appear + dt * 3.5);
      const t = this.appear, back = 1 + 2.7 * (t - 1) ** 3 + 1.7 * (t - 1) ** 2;
      V.root.scale.setScalar(Math.max(0.001, back));
    }
    placeShadow(this.shadow, p.x, this.S.w, Math.max(0, p.y - this.hy));

    const ay = clamp((v.y - (this.prevVy ?? v.y)) / Math.max(dt, 1e-3), -900, 900);
    const ax = clamp((v.x - (this.prevVx ?? v.x)) / Math.max(dt, 1e-3), -900, 900);
    this.prevVy = v.y; this.prevVx = v.x;
    // resting pose (sleep, squat) plus slow breathing while asleep
    let target = this.grounded ? this.poseSq + (this.asleep ? Math.sin(performance.now() / 650) * 0.035 : 0)
      : clamp(v.y * 0.004, -0.08, 0.12);
    if (this.crouch > 0) target = -0.22;

    // The springs are stiff, so integrate them in small steps; one long frame would make them explode.
    for (let n = Math.ceil(dt / (1 / 120)), h = dt / n; n > 0; n--) {
      // turning: a snappy, slightly overshooting spring toward the facing pose
      this.yawV += ((this.facing * FACE_YAW - this.yaw) * 500 - this.yawV * 34) * h;
      this.yaw = clamp(this.yaw + this.yawV * h, -1, 1);
      // squash & stretch
      this.sqV += ((target - this.sq) * 260 - this.sqV * 14) * h;
      this.sq = clamp(this.sq + this.sqV * h, -0.4, 0.35);
      // ears, tails and other loose parts lag behind the body, all in the screen plane
      for (const e of V.anim) {
        const [k, c, gain, lim] = SPRINGS[e.motion] ?? SPRINGS.loose;
        if (!k) continue;
        e.v += (-e.a * k - e.v * c + (ay * 0.004 * -(e.side || 1) + ax * 0.003) * gain) * h;
        e.a = clamp(e.a + e.v * h, -lim, lim);
      }
    }
    V.squash.rotation.y = this.yaw + this.spin;
    const sy = 1 + this.sq, sxz = 1 / Math.sqrt(sy);
    V.squash.scale.set(sxz, sy, sxz);
    const now = performance.now();
    for (const e of V.anim) {
      if (e.motion === 'flicker') { e.g.scale.y = 1 + Math.sin(now / 60 + e.ph) * 0.1 + Math.sin(now / 37 + e.ph) * 0.06; continue; }
      if (e.motion === 'wing') {
        e.g.rotation.z = e.side * (this.grounded ? Math.sin(now / 500 + e.ph) * 0.08 : Math.sin(now / 45) * 0.55);
        continue;
      }
      // tails wag up and down in the screen plane, and a single tail trails behind the way it faces,
      // swinging across when it turns
      e.g.rotation.z = e.a + (e.motion === 'tail' ? Math.sin(now / 260) * 0.22 * (e.side || 1) : 0);
      if (e.motion === 'tail' && e.side === 1) {
        if (this.facing) e.trail = -this.facing;
        e.flip = (e.flip ?? 1) + ((e.trail ?? 1) - (e.flip ?? 1)) * Math.min(1, dt * 9);
        e.g.scale.x = Math.abs(e.flip) < 0.05 ? 0.05 * Math.sign(e.flip || 1) : e.flip;
      }
    }

    // blink
    this.blink -= dt;
    if (this.blink < -0.12) this.blink = rand(2, 5.5);
    const show = this.dazed > 0 || this.blink < 0 ? 'shut' : this.expr;
    if (show !== this.shownExpr) { V.setExpr(show); this.shownExpr = show; }
  }
}

// ---------------- props ----------------
// Physical things in the world. Each is a voxel model on a Rapier body locked to the screen plane.
const props = [];

class Prop {
  // shape: 'ball' or 'box'. fixed: true for furniture that never moves.
  constructor(kind, vox, { x, y, shape = 'ball', density = 0.3, restitution = 0.3, friction = 0.8, fixed = false, scale = 1 } = {}) {
    this.kind = kind; this.vox = vox; this.scale = scale;
    const [mn, mx] = vox.bounds();
    // centre of the model in its own voxel space; stays fixed even as bites shrink the model
    this.center = [(mn[0] + mx[0] + 1) / 2, (mn[1] + mx[1] + 1) / 2, (mn[2] + mx[2] + 1) / 2];
    this.size = [mx[0] - mn[0] + 1, mx[1] - mn[1] + 1, mx[2] - mn[2] + 1].map(v => v * scale);
    this.g = new THREE.Group();
    scene.add(this.g);
    this.rebuild();
    this.shadow = blobShadow();
    const desc = fixed ? RAPIER.RigidBodyDesc.fixed() : RAPIER.RigidBodyDesc.dynamic()
      .enabledTranslations(true, true, false).enabledRotations(false, false, true)
      .setCcdEnabled(true).setLinearDamping(0.15).setAngularDamping(0.5);
    this.body = world.createRigidBody(desc.setTranslation(x, y, 0));
    const [sx, sy, sz] = this.size;
    this.r = shape === 'ball' ? Math.max(sx, sy) / 2 * 0.92 : sy / 2;
    const cd = shape === 'ball' ? RAPIER.ColliderDesc.ball(this.r) : RAPIER.ColliderDesc.cuboid(sx / 2, sy / 2, sz / 2);
    world.createCollider(cd.setDensity(density).setRestitution(restitution).setFriction(friction)
      .setCollisionGroups(groups(G.PROP, G.WORLD | G.WALL | G.PET | G.PROP)), this.body);
    this.halfH = sy / 2;
    props.push(this);
  }
  rebuild() {
    if (this.mesh) { this.g.remove(this.mesh); this.mesh.geometry.dispose(); }
    this.mesh = voxMesh(this.vox);
    this.mesh.scale.setScalar(this.scale);
    this.mesh.position.set(...this.center.map(c => -c * this.scale));
    this.g.add(this.mesh);
  }
  // Once removed, a prop keeps answering with where it was last. Touching a removed Rapier body
  // crashes inside Rapier and breaks every physics call after it, and actions can still be holding
  // on to a prop for a moment (the broom sweeps the poop up before the clean action finishes).
  pos() { return this.gone ? this.lastPos : this.body.translation(); }
  update() {
    const p = this.pos();
    this.g.position.set(p.x, p.y, 0);
    this.g.quaternion.copy(this.body.rotation());
    placeShadow(this.shadow, p.x, this.size[0], Math.max(0, p.y - this.halfH));
  }
  remove() {
    if (this.gone) return;
    this.lastPos = this.body.translation();
    scene.remove(this.g, this.shadow);
    world.removeRigidBody(this.body);
    props.splice(props.indexOf(this), 1);
    this.gone = true;
  }
}

// --- food ---
// Small voxel snacks. bites = how many chomps it takes to finish one; value / fun / health are how
// much the whole thing restores.
const sphereVox = (r, paint) => {
  const vox = new Vox(), n = Math.ceil(r);
  for (let x = -n; x < n; x++) for (let y = -n; y < n; y++) for (let z = -n; z < n; z++) {
    if (Math.hypot(x + 0.5, y + 0.5, z + 0.5) <= r) vox.set(x, y, z, paint(x, y, z));
  }
  return vox;
};
const FOODS = {
  apple: { bites: 4, value: 30, make() {
    const v = sphereVox(2.3, (x, y) => (y >= 1 && x < 0 ? 0xff7a6e : 0xe8433a));
    v.set(0, 2, 0, 0x7a4a2a); v.set(0, 3, 0, 0x7a4a2a); v.set(1, 3, 0, 0x5cc04a); v.set(2, 3, 0, 0x5cc04a);
    return v;
  } },
  fish: { bites: 5, value: 40, make() {
    const v = new Vox();
    for (let x = -3; x <= 2; x++) for (let y = -1; y <= 1; y++) for (let z = -1; z <= 0; z++) {
      if (Math.abs(y) === 1 && (x === -3 || x === 2)) continue;
      v.set(x, y, z, y === -1 ? 0xd6e4ef : 0x7fa8c9);
    }
    for (const y of [-2, -1, 1, 2]) v.set(3 + (Math.abs(y) === 2 ? 1 : 0), y, 0, 0x5b86ab);
    v.set(3, 0, 0, 0x5b86ab);
    v.set(-2, 0, 1, 0x1a1a22);
    return v;
  } },
  cookie: { bites: 3, value: 20, fun: 10, make() {
    const v = new Vox(), chips = [[-1, 1], [1, -1], [2, 1], [-2, -1], [0, 0]];
    for (let x = -3; x < 3; x++) for (let y = -3; y < 3; y++) {
      if (Math.hypot(x + 0.5, y + 0.5) > 3) continue;
      v.set(x, y, 0, chips.some(([cx, cy]) => cx === x && cy === y) ? 0x5a3420 : 0xd9a05b);
      v.set(x, y, -1, 0xc48a48);
    }
    return v;
  } },
  cake: { bites: 6, value: 30, fun: 25, make() {
    const v = new Vox();
    for (let x = -3; x < 3; x++) for (let z = -2; z < 2; z++) {
      for (let y = 0; y < 4; y++) v.set(x, y, z, y === 3 ? 0xffb3d1 : y === 1 ? 0xfff1c9 : 0xf3d39a);
    }
    v.set(0, 4, 0, 0xe0213f); v.set(-1, 4, 0, 0xe0213f);
    return v;
  } },
  // medicine for when it's poorly
  pill: { bites: 1, value: 0, health: 50, make() {
    const v = new Vox();
    for (let x = -2; x < 2; x++) for (let y = 0; y < 2; y++) for (let z = 0; z < 2; z++) v.set(x, y, z, x < 0 ? 0xff5d73 : 0xffffff);
    return v;
  } },
};
// The dispenser drops food in from the top of the screen, but never more than a few at once (medicine
// always gets through). Returns null if there's already plenty about.
const FOOD_MAX = 3;
function dropFood(kind = ['apple', 'fish', 'cookie'][Math.floor(Math.random() * 3)], x) {
  if (kind !== 'pill' && props.filter(pr => pr.kind === 'food' && pr.food !== 'pill').length >= FOOD_MAX) return null;
  const F = FOODS[kind];
  const p = new Prop('food', F.make(), { x: x ?? rand(B.left + 10, B.right - 10), y: screenTop() + 6, density: 0.25, restitution: 0.35 });
  p.food = kind; p.bitesLeft = F.bites; p.bitesTotal = F.bites;
  p.body.setAngvel({ x: 0, y: 0, z: rand(-4, 4) }, true);
  return p;
}
// Food nobody eats goes off: untouched for 40 s on screen (or a half-eaten leftover for 90 s), it
// vanishes in a little puff. Whatever the pet is busy eating is left alone.
function spoilFood(dt) {
  for (const f of [...props]) {
    if (f.kind !== 'food' || pet.action?.food === f) continue;
    f.age = (f.age ?? 0) + dt;
    if (f.age < (f.bitesLeft < f.bitesTotal ? 90 : 40)) continue;
    const q = f.pos();
    spawnBits(q.x, q.y, SPARKLE, 10, { vy: 8, spread: 8, size: 0.4, life: 1, grav: 0 });
    sfx('poof');
    f.remove();
  }
}
// Take a bite from the side facing `fromX`. Returns false once there's nothing left.
function biteFood(food, fromX) {
  const p = food.pos(), side = Math.sign(fromX - p.x) || 1;
  const all = [...food.vox.each()];
  const n = Math.ceil(all.length / food.bitesLeft);
  // nearest voxels to the biter first: in world x, through the prop's current rotation
  const roll = rollOf(tmpQ.copy(food.body.rotation())), c = Math.cos(roll), s = Math.sin(roll);
  all.sort((a, b) => side * ((b[0] * c - b[1] * s) - (a[0] * c - a[1] * s)));
  for (const [x, y, z, col] of all.slice(0, n)) {
    food.vox.m.delete(Vox.key(x, y, z));
    if (Math.random() < 0.6) {
      spawnBits(p.x + side * food.size[0] * 0.3, p.y, [col], 1, { vx: side * rand(4, 12), vy: rand(8, 20) });
    }
  }
  food.bitesLeft--;
  if (food.bitesLeft <= 0 || food.vox.m.size === 0) { food.remove(); return false; }
  food.rebuild();
  return true;
}

// --- poop (gets swept away by the clean-up) ---
function dropPoop(x, y) {
  const v = new Vox(), c = [0x7a4f2a, 0x8d5c33];
  for (let x2 = -2; x2 < 2; x2++) for (let z = -1; z < 1; z++) v.set(x2, 0, z, c[0]);
  for (let x2 = -1; x2 < 1; x2++) for (let z = -1; z < 1; z++) v.set(x2, 1, z, c[1]);
  v.set(0, 2, 0, c[0]);
  return new Prop('poop', v, { x, y, shape: 'box', density: 0.6, restitution: 0.05, friction: 1 });
}

// --- bed: a cushion it sleeps on ---
function placeBed(x) {
  const v = new Vox();
  for (let x2 = -7; x2 < 7; x2++) for (let z = -3; z < 3; z++) {
    const edge = x2 === -7 || x2 === 6 || z === -3 || z === 2;
    v.set(x2, 0, z, pal.dark);
    if (edge) v.set(x2, 1, z, pal.accent);
  }
  return new Prop('bed', v, { x, y: 1, shape: 'box', fixed: true, friction: 1 });
}

// --- ball ---
function dropBall(x) {
  const cols = [0xff4d6d, 0xffffff, 0x3ab0ff, 0xffd23f];
  const vox = sphereVox(2.9, (a, b, c) => cols[(Math.floor(Math.atan2(c + 0.5, a + 0.5) / (Math.PI / 2) + 4)) % 4]);
  return new Prop('ball', vox, { x: x ?? rand(B.left + 10, B.right - 10), y: screenTop() + 6,
    density: 0.12, restitution: 0.65, friction: 0.6, scale: 2.2 / 2.9 });
}

// ---------------- bits: crumbs, sparkles, Zzz ----------------
// Hundreds of tiny cubes in one instanced mesh. They don't need Rapier: they live in the screen plane
// and only have to bounce off the floor and walls, so they get a few lines of physics of their own.
const BITS_MAX = 400;
const bitsMesh = new THREE.InstancedMesh(new THREE.BoxGeometry(1, 1, 1), new THREE.MeshLambertMaterial(), BITS_MAX);
bitsMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
bitsMesh.count = 0;
bitsMesh.frustumCulled = false;
scene.add(bitsMesh);
const bits = [];
// opts: vx, vy (base velocity), spread, size, life, grav (1 = normal, 0 = floats), z
function spawnBits(x, y, colors, n, opts = {}) {
  const { vx = 0, vy = 10, spread = 8, size = 0.55, life = 2.5, grav = 1, z = 0 } = opts;
  for (let i = 0; i < n && bits.length < BITS_MAX; i++) {
    bits.push({
      x, y, z: z + rand(-0.5, 0.5), vx: vx + rand(-spread, spread), vy: vy + rand(-spread, spread) * 0.5,
      a: rand(0, 6), va: rand(-10, 10), s: size * rand(0.8, 1.2), life: life * rand(0.8, 1.2), age: 0, grav,
      color: new THREE.Color(colors[Math.floor(Math.random() * colors.length)]),
    });
  }
}
const bitM = new THREE.Matrix4(), bitQ = new THREE.Quaternion(), bitE = new THREE.Euler(), bitS = new THREE.Vector3(), bitP = new THREE.Vector3();
function updateBits(dt) {
  for (let i = bits.length - 1; i >= 0; i--) {
    const b = bits[i];
    b.age += dt;
    if (b.age >= b.life) { bits.splice(i, 1); continue; }
    b.vy -= GRAVITY * b.grav * dt;
    if (b.grav === 0) { b.vx *= 1 - dt * 1.5; b.vy *= 1 - dt * 1.5; }
    b.x += b.vx * dt; b.y += b.vy * dt; b.a += b.va * dt;
    if (b.y < b.s / 2 && b.grav > 0) { b.y = b.s / 2; b.vy = Math.abs(b.vy) * 0.35; b.vx *= 0.6; b.va *= 0.6; }
    if (b.x < B.left) { b.x = B.left; b.vx = Math.abs(b.vx) * 0.5; }
    if (b.x > B.right) { b.x = B.right; b.vx = -Math.abs(b.vx) * 0.5; }
  }
  bitsMesh.count = bits.length;
  bits.forEach((b, i) => {
    const k = b.s * Math.min(1, (b.life - b.age) * 3);  // shrink away at the end
    bitM.compose(bitP.set(b.x, b.y, b.z), bitQ.setFromEuler(bitE.set(0, 0, b.a)), bitS.set(k, k, k));
    bitsMesh.setMatrixAt(i, bitM);
    bitsMesh.setColorAt(i, b.color);
  });
  bitsMesh.instanceMatrix.needsUpdate = true;
  if (bitsMesh.instanceColor) bitsMesh.instanceColor.needsUpdate = true;
}
const SPARKLE = [0xffffff, 0xfff3a0, 0xa8f0ff];
// A burst of soft voxel smoke around an area w × h centred on (x, y).
function smokePuff(x, y, w, h) {
  const smoke = [0xffffff, 0xeeeaf6, 0xd8d0ea, 0xc2b8dc];
  for (let i = 0; i < 40; i++) {
    const a = Math.random() * Math.PI * 2, r = rand(0.2, 1), sp = rand(5, 13);
    spawnBits(x + Math.cos(a) * w * 0.5 * r, y + Math.sin(a) * h * 0.5 * r, smoke, 1,
      { vx: Math.cos(a) * sp, vy: Math.sin(a) * sp + 4, spread: 1.5, size: rand(0.9, 1.8), life: rand(0.5, 1), grav: 0 });
  }
}

// ---------------- life: needs ----------------
// Needs run from 0 (desperate) to 100 (perfectly happy) and fall over time. The overlay is the
// caretaker, so the brain always finds a way to fix them; how well that goes shapes it later.
// The live state is the save itself: needs, health, digestAt (life-clock time the next poop is due,
// 0 = nothing to digest) and t (the life clock in seconds, which runs at ?speed).
const life = save;
const N = life.needs;
const DECAY = { hunger: 40, energy: 22, fun: 55, hygiene: 6, social: 35 }; // points per hour, awake
for (const kv of (Q.get('set') || '').split(',')) {        // ?set=hunger:10,energy:5 for testing
  const [k, v] = kv.split(':');
  if (k in N) N[k] = clamp(+v, 0, 100); else if (k === 'health') life.health = clamp(+v, 0, 100);
}

function tickLife(dt) {
  const h = dt * CFG.speed / 3600;
  life.t += dt * CFG.speed;
  const asleep = pet.asleep;
  for (const k in DECAY) N[k] -= DECAY[k] * h * (asleep ? (k === 'energy' ? 0 : 0.35) : 1);
  if (asleep) N.energy += 70 * h;
  N.hygiene -= 25 * h * props.filter(p => p.kind === 'poop').length;
  for (const k in N) N[k] = clamp(N[k], 0, 100);
  // health only suffers if a body need is badly neglected, and recovers slowly otherwise. (Social is
  // about mood, and chat is the only thing that fills it, so it never makes the pet ill.)
  const low = N.hunger < 12 || N.energy < 12 || N.hygiene < 12;
  life.health = clamp(life.health + (low ? -25 : 6) * h, 0, 100);
  if (life.health < 20) (save.flags ??= {}).wasSick = true;
}

// Night hours (local time) make it want to sleep. ?night=1-7 by default, ?night=off to never.
// Bedtime, in this PC's local time. 24-hour ("1-7" is 1 am to 7 am, "13-19" is 1 pm to 7 pm) or with
// am/pm ("11pm-7am", "1-7pm"; a lone am/pm applies to both ends). "off" means never.
const NIGHT = (() => {
  const m = /^(\d{1,2})\s*(am|pm)?\s*(?:-|–|to)\s*(\d{1,2})\s*(am|pm)?$/i.exec(CFG.night.trim());
  if (!m) return null;
  const sa = m[2] || m[4], sb = m[4] || m[2];
  const h = (n, suf) => (suf ? (n % 12) + (/pm/i.test(suf) ? 12 : 0) : n % 24);
  return [h(+m[1], sa), h(+m[3], sb)];
})();
function isNight() {
  if (!NIGHT) return false;
  const h = new Date().getHours(), [a, b] = NIGHT;
  return a <= b ? h >= a && h < b : h >= a || h < b;
}

// ---------------- brain: utility AI ----------------
// Every half second each action scores how much it wants to run (roughly 0..1) from the needs, and the
// best one wins. The running action gets a bonus so it doesn't flip-flop, and some have a minimum
// time. An action's step() returns true when it's finished; `cool` keeps it from being picked again
// for that many seconds after it ends.
const want = (v, from) => clamp((from - v) / from, 0, 1);
const GROSS_CHANCE = num('gross', 0.05, 0, 1); // how often it eats its poop instead of letting the broom have it
const findProp = (kind, near) => {
  let best = null, bd = Infinity;
  for (const p of props) {
    if (p.kind !== kind || (kind === 'food' && p.food === 'pill')) continue;
    const d = Math.abs(p.pos().x - near);
    if (d < bd) { bd = d; best = p; }
  }
  return best;
};
const spotNear = (x, off) => clamp(x + off, B.left + 8, B.right - 8);

// Shared by eat and sick: hop next to the food and chomp until it's gone.
function eatStep(p, dt, a) {
  const food = a.food, px = p.pos().x;
  if (!food || food.gone) { p.mood('happy', 1.6); return true; }
  const fp = food.pos();
  if (fp.y > food.halfH + 3 && food.body.linvel().y < -1) { p.face(Math.sign(fp.x - px)); return; } // falling: watch it
  const side = Math.sign(px - fp.x) || 1;
  if (p.hopToward(fp.x + side * (p.hx + food.size[0] / 2 + 0.3), 1.2, dt)) {
    p.face(-side);
    a.chomp = (a.chomp ?? 0.2) - dt;
    if (a.chomp <= 0 && p.grounded) {
      a.chomp = 0.45;
      p.sqV -= 2.2;
      const F = FOODS[food.food];
      N.hunger = clamp(N.hunger + F.value / F.bites, 0, 100);
      if (F.fun) N.fun = clamp(N.fun + F.fun / F.bites, 0, 100);
      if (F.health) life.health = clamp(life.health + F.health / F.bites, 0, 100);
      if (F.value && !life.digestAt) life.digestAt = life.t + rand(600, 1500);
      biteFood(food, px);
      sfx('chomp');
    }
  }
}

const ACTIONS = {
  idle: {
    score: () => 0.16,
    start(p, a) { a.until = rand(3, 8); a.glance = rand(0.5, 2); },
    step(p, dt, a) {
      // face the camera, with the odd glance to one side
      if ((a.glance -= dt) <= 0) {
        p.face(p.facing === 0 && Math.random() < 0.4 ? (Math.random() < 0.5 ? -1 : 1) : 0);
        a.glance = p.facing ? rand(0.6, 1.4) : rand(1.5, 4);
      }
      return a.t > a.until;
    },
  },
  wander: {
    score: () => 0.17,
    start(p, a) {
      const x = p.pos().x, m = p.hx + 2;
      a.x = Math.random() < 0.6 ? clamp(x + rand(-30, 30), B.left + m, B.right - m) : rand(B.left + m, B.right - m);
    },
    step: (p, dt, a) => p.hopToward(a.x, 2, dt) || a.t > 20,
  },
  eat: {
    bubble: '🍎',
    score: () => want(N.hunger, 55) ** 0.7 * 1.15 + (findProp('food', 0) && N.hunger < 85 ? 0.3 : 0),
    start(p, a) {
      const x = p.pos().x;
      a.food = findProp('food', x) ?? dropFood(undefined, spotNear(x, (p.facing || (Math.random() < 0.5 ? -1 : 1)) * rand(10, 16)));
    },
    step: (p, dt, a) => eatStep(p, dt, a) || a.t > 30,
  },
  sick: {
    bubble: '🤒',
    score: () => (life.health < 35 ? 1.3 : 0),
    start(p, a) { a.food = dropFood('pill', spotNear(p.pos().x, rand(-10, 10))); p.expr = 'sad'; },
    step: (p, dt, a) => eatStep(p, dt, a) || a.t > 30,
    end(p) { p.expr = 'open'; },
  },
  sleep: {
    bubble: '💤', minTime: 20,
    // at bedtime it goes to bed whatever its energy, and sleeps until bedtime's over
    score: () => (isNight() ? 1 : want(N.energy, 35) * 1.1),
    start(p, a) { a.z = 0; },
    step(p, dt, a) {
      const bed = findProp('bed', p.pos().x);
      if (!p.asleep) {
        if ((!bed || p.hopToward(bed.pos().x, 1.5, dt)) && p.grounded) {
          p.asleep = true; p.face(0); p.poseSq = -0.18; p.expr = 'shut';
        }
        return a.t > 25 && !p.asleep;
      }
      if ((a.z -= dt) <= 0) {
        a.z = 1.3;
        const q = p.pos();
        floatText(q.x + p.hx * 0.6, q.y + p.hy + 1, 'z', 'zzz');
      }
      return N.energy >= 99 && !isNight();
    },
    end(p) { p.asleep = false; p.poseSq = 0; p.expr = 'open'; p.sqV += 3; }, // and a stretch
  },
  play: {
    bubble: '⚽', cool: 8,
    score: () => want(N.fun, 50) * 0.85,
    start(p, a) {
      a.ball = findProp('ball', p.pos().x) ?? dropBall(spotNear(p.pos().x, rand(-15, 15)));
      a.until = rand(15, 30);
    },
    step(p, dt, a) {
      const ball = a.ball;
      if (ball.gone) return true;
      const bp = ball.pos(), px = p.pos().x, reach = p.hx + ball.r + 0.3;
      // Kick it away from the side it's on, or out of a corner toward the middle. The direction is
      // picked once per kick so the pet doesn't dither between sides.
      if (!a.dir) {
        a.dir = bp.x < B.left + 10 ? 1 : bp.x > B.right - 10 ? -1 : Math.sign(bp.x - px) || 1;
      }
      const close = Math.abs(bp.x - px) < reach + 1.5 && bp.y < ball.r + 4;
      if (close && p.grounded && (a.kickT = (a.kickT ?? 0) - dt) <= 0) {
        p.face(a.dir);
        const m = ball.body.mass();
        ball.body.applyImpulse({ x: a.dir * m * rand(25, 45), y: m * rand(15, 40), z: 0 }, true);
        sfx('hop');
        p.sqV += 2;
        N.fun = clamp(N.fun + 7, 0, 100);
        p.mood('happy', 1);
        a.dir = 0; a.kickT = 0.6;
      } else if (!close && bp.y < ball.r + 4) {
        p.hopToward(clamp(bp.x - a.dir * reach, B.left + p.hx, B.right - p.hx), 1.6, dt);
      }
      return a.t > a.until || N.fun >= 98;
    },
  },
  zoomies: {
    bubble: '❗', cool: 30,
    score: () => (N.fun > 60 && N.energy > 55 ? 0.1 : 0) + (life.hype ?? 0),
    start(p, a) {
      const x = p.pos().x;
      a.xs = [spotNear(x, 22), spotNear(x, -22)];
      if (Math.random() < 0.5) a.xs.reverse();
      a.leg = 0; a.legs = 3 + Math.floor(rand(0, 3));
      p.expr = 'happy'; p.speedUp = 1.6;
    },
    step(p, dt, a) {
      if (p.hopToward(a.xs[a.leg % 2], 2.5, dt)) a.leg++;
      return a.leg >= a.legs || a.t > 15;
    },
    end(p) { p.expr = 'open'; p.speedUp = 1; N.fun = clamp(N.fun + 10, 0, 100); life.hype = 0; },
  },
  clean: {
    bubble: '🧹', cool: 3,
    score: () => (findProp('poop', 0) ? 0.4 + want(N.hygiene, 60) * 0.5 : want(N.hygiene, 30) * 0.7),
    start(p, a) {
      a.poop = findProp('poop', p.pos().x);
      // every so often it gets to the poop before the broom does, and eats it. Yuck. It'll be poorly
      // for a bit, until the medicine kicks in.
      if (a.poop && Math.random() < GROSS_CHANCE) a.gross = true;
      else if (a.poop) a.broom = sweepAway(a.poop);
      a.shake = 0;
    },
    step(p, dt, a) {
      if (a.gross) {
        const pp = a.poop.pos(), px = p.pos().x;
        if (a.poop.gone) return true;
        if (!p.hopToward(pp.x + Math.sign(px - pp.x || 1) * (p.hx + 1.5), 1.2, dt) || !p.grounded) return a.t > 15;
        p.face(Math.sign(pp.x - px));
        p.sqV -= 2.2;
        spawnBits(pp.x, pp.y + 0.5, [0x7a4f2a, 0x8d5c33], 8, { vy: 12, spread: 8, size: 0.45, life: 1.2 });
        sfx('chomp');
        a.poop.remove();
        showBubble('🤢');
        life.health = Math.min(life.health, 30);  // low enough to be sick, so the medicine comes
        N.hygiene = clamp(N.hygiene - 20, 0, 100);
        p.mood('sad', 3);
        return true;
      }
      if (a.poop) {
        p.face(Math.sign(a.poop.pos().x - p.pos().x));
        if (!a.broom.done) return false;
        N.hygiene = clamp(N.hygiene + 35, 0, 100);
        p.mood('happy', 1.2);
        return true;
      }
      // nothing to sweep: shake off instead
      a.shake += dt;
      p.face(Math.floor(a.shake * 12) % 2 ? 1 : -1);
      if (Math.random() < 0.5) {
        const q = p.pos();
        spawnBits(q.x, q.y + p.hy * 0.5, [0xa8dcff, 0xd8f0ff], 1, { vy: 18, spread: 16, size: 0.4, life: 0.8 });
      }
      if (a.shake > 1.1) { N.hygiene = 100; p.face(0); return true; }
    },
  },
  poop: {
    score: () => (life.digestAt && life.t >= life.digestAt ? 0.9 : 0),
    start(p) { p.poseSq = -0.3; p.expr = 'shut'; p.face(0); },
    step(p, dt, a) {
      if (a.t < 1.3) return false;
      const q = p.pos(), side = Math.random() < 0.5 ? -1 : 1;
      dropPoop(clamp(q.x + side * (p.hx + 2.5), B.left + 3, B.right - 3), 2);
      life.digestAt = 0;
      p.sqV += 3;
      return true;
    },
    end(p) { p.poseSq = 0; p.expr = 'open'; },
  },
};

function brainStep(p, dt) {
  const cur = p.action;
  let done = false;
  if (cur) { cur.t += dt; done = cur.def.step(p, dt, cur) === true; }
  if (!done && (p.rethink -= dt) > 0) return;
  p.rethink = 0.5;
  let best = null, bestScore = -1;
  p.scores = {};
  for (const [name, def] of Object.entries(ACTIONS)) {
    let s = def.score(p) + Math.random() * 0.04 - (p.cool[name] > life.t ? 0.5 : 0);
    if (cur && !done && name === cur.name) s += 0.2; // stick with what it's doing
    p.scores[name] = s;
    if (s > bestScore) { bestScore = s; best = name; }
  }
  const mustFinish = cur && !done && cur.t < (cur.def.minTime ?? 0);
  if (!mustFinish && (done || best !== cur?.name)) startAction(p, best);
}
function startAction(p, name) {
  if (p.action) {
    p.action.def.end?.(p, p.action);
    p.cool[p.action.name] = life.t + (p.action.def.cool ?? 0) * CFG.speed; // a short rest from it
  }
  const def = ACTIONS[name], a = { name, def, t: 0 };
  p.action = a;
  def.start?.(p, a);
  if (def.bubble) showBubble(def.bubble);
}

// ---------------- life cycle ----------------
// It grows by hours on screen (only while the source is visible), so it grows up with the channel.
// AGES is the age, in hours, at which each stage ends. ?agerate= speeds this up for testing.
const AGES = { egg: 5 / 60, baby: 2, child: 6, teen: 15, adult: 60, elder: 80 };
const NEXT = { egg: 'baby', baby: 'child', child: 'teen', teen: 'adult', adult: 'elder' };
const AGERATE = num('agerate', 1, 0.01, 1e6);
const ageHours = () => save.age / 3600;

function recipeFor(stage) {
  if (stage === 'teen') return save.teen ?? STAGES.teen;
  if (stage === 'adult' || stage === 'elder') return save.form ?? STAGES.adult;
  return STAGES[stage];
}

// Elders go a little grey.
function palFor(s) {
  const f = s.stage === 'adult' || s.stage === 'elder' ? s.form : null;
  const p = withPartColours(f?.special ? specialPalette(f.special, s.seed)
    : f?.element ? elementPalette(f.element, s.seed) : makePalette(s.seed, s.hue));
  if (s.stage !== 'elder') return p;
  const grey = (hex) => {
    const c = new THREE.Color().setHex(hex, THREE.SRGBColorSpace), hsl = {};
    c.getHSL(hsl, THREE.SRGBColorSpace);
    return c.setHSL(hsl.h, hsl.s * 0.55, Math.min(0.92, hsl.l + 0.06), THREE.SRGBColorSpace).getHex(THREE.SRGBColorSpace);
  };
  for (const k of ['body', 'belly', 'accent', 'dark']) p[k] = grey(p[k]);
  return p;
}

// Cute generated names: two syllables and maybe an ending.
function makeName(seed) {
  const r = rngFrom(hashStr('name:' + seed)), pick = (a) => a[Math.floor(r() * a.length)];
  const A = ['Bo', 'Mi', 'Pip', 'Lu', 'Ka', 'Zu', 'Nim', 'Fi', 'To', 'Ra', 'Po', 'Chi', 'Mo', 'Bea', 'Dot', 'Wix', 'Pa', 'Nu', 'Ki', 'Sa', 'Gum', 'Tib'];
  // (no 'ka' in the middle: it spells a couple of unkind words with the starts above)
  const Bs = ['bo', 'mi', 'pi', 'lu', 'zu', 'ni', 'fi', 'to', 'chi', 'mo', 'ri', 'pu', 'do', 'ki', 'sy'];
  const E = ['', '', '', 'n', 'bit', 'ble', 'kin', 'p', 'o', 'y'];
  // a couple of other pairs that spell something unkind
  const AVOID = ['Pa|ki', 'Po||o'];
  for (;;) {
    const a = pick(A), b = r() < 0.7 ? pick(Bs) : '', e = pick(E);
    if (!AVOID.some(x => (a + '|' + b + '|' + e).startsWith(x))) return a + b + e;
  }
}

// Traits build up from how its life is going, an hour at a time. Chat and stream events add to them
// directly as they happen.
function tickAge(dt) {
  const h = dt * CFG.speed * AGERATE / 3600;
  save.age += h * 3600;
  if (save.stage !== 'egg') {
    const T = save.traits, act = pet.action?.name, hour = new Date().getHours();
    T.fed += h * 0.6 * clamp((N.hunger - 55) / 45, 0, 1); // more the fuller it's kept
    if (pet.asleep) T.rested += isNight() ? 2 * h : h;
    if (act === 'play' || act === 'zoomies') T.playful += 3 * h;
    if (N.social > 60) T.social += h;
    if (save.t - (life.lastChat ?? -1e9) > 300 * CFG.speed) T.calm += h * 0.5; // quiet stretches
    if (hour >= 22 || hour < 4) T.nightowl += h;
    save.tod[Math.floor(hour / 6)] += h;
  }
  if (!cutscene && NEXT[save.stage] && ageHours() >= AGES[save.stage]) evolve(NEXT[save.stage]);
}

// ---- hatching and evolving ----
let cutscene = null;
function evolve(next) {
  const from = save.stage;
  if (next === 'baby') {
    const now = new Date();
    save.hatchMonth = now.getMonth(); save.hatchDay = now.getDate(); save.hatchHour = now.getHours();
    save.name ??= CFG.name || makeName(save.seed);
  }
  if (next === 'teen') save.teen = chooseTeen();
  if (next === 'adult') { const f = chooseAdult(); save.form = f.recipe; save.formName = f.name; }
  save.stage = next;
  writeSave();
  if (pet.action) { pet.action.def.end?.(pet, pet.action); pet.action = null; }
  pet.frozen = true;
  cutscene = { t: 0, from, next, swapped: false, shake: 0 };
}
function stepCutscene(dt) {
  const c = cutscene, hatch = c.from === 'egg', q = pet.pos();
  c.t += dt;
  if (!c.swapped) {
    if (hatch) {
      // rocks harder and harder, with bits of shell flying
      if ((c.shake -= dt) <= 0) {
        c.shake = Math.max(0.08, 0.3 - c.t * 0.15);
        pet.body.applyTorqueImpulse({ x: 0, y: 0, z: pet.inertia * (Math.random() < 0.5 ? -1 : 1) * (1 + c.t * 2) }, true);
        spawnBits(q.x, q.y + pet.hy * 0.5, [pal.shell, pal.accent], 2, { vy: 14, spread: 10, size: 0.45, life: 1.2 });
        sfx('crack');
      }
    } else if (Math.random() < 0.5) {
      spawnBits(q.x + rand(-pet.hx, pet.hx), q.y + rand(-pet.hy, pet.hy), SPARKLE, 1, { vy: 6, spread: 6, size: 0.4, life: 1, grav: 0 });
    }
    if (c.t >= (hatch ? 2.2 : 1.4)) {
      // the swap: the new body pops out of a burst
      const oldPal = pal;
      pal = palFor(save);
      pet.build(recipeFor(c.next), c.next, q.x, q.y + 1);
      pet.frozen = true;
      pet.body.applyImpulse({ x: 0, y: pet.body.mass() * 25, z: 0 }, true);
      sfx('sparkle');
      spawnBits(q.x, q.y, hatch ? [oldPal.shell, oldPal.accent] : [pal.body, pal.accent, ...SPARKLE], hatch ? 30 : 40,
        { vy: 20, spread: 18, size: 0.5, life: 1.8, grav: hatch ? 1 : 0.15 });
      c.swapped = true;
      showStatus(7000);
      showBanner(
        hatch ? `Hatched! Say hi to ${save.name}` :
        c.next === 'adult' ? `${save.name} became ${/^[aeiou]/i.test(save.formName) ? 'an' : 'a'} ${save.formName}!` :
        c.next === 'elder' ? `${save.name} is all grown old` : `${save.name} is growing up!`);
    }
  } else if (c.t >= (hatch ? 3.6 : 2.8)) {
    cutscene = null;
    pet.frozen = false;
    pet.mood('happy', 2);
  }
  // evolving spins it: six full turns, eased in and out, so it ends facing the camera again
  if (!hatch) pet.spin = Math.PI * 2 * 6 * (c.t >= 2.8 ? 1 : (1 - Math.cos(Math.PI * c.t / 2.8)) / 2);
}

// ---- retiring: the elder lays an egg, waves goodbye and leaves ----
ACTIONS.retire = {
  minTime: 1e9,
  score: () => (save.stage === 'elder' && ageHours() >= AGES.elder && !cutscene ? 5 : 0),
  start(p, a) { p.face(0); p.expr = 'happy'; showBanner(`${save.name} is off on an adventure! 💛`); },
  step(p, dt, a) {
    const q = p.pos();
    if (a.t < 2.5) {                       // wave
      for (const e of p.vis.anim) if (e.motion === 'loose') e.v += Math.sin(a.t * 14) * 40 * dt * (e.side || 1);
      return false;
    }
    if (!a.egg) {                           // lay the egg
      a.child = newSave(Math.floor(Math.random() * 1e9), save);
      const childPal = makePalette(a.child.seed, a.child.hue);
      const side = q.x > (B.left + B.right) / 2 ? -1 : 1;
      a.egg = new Prop('egg', eggVox(STAGES.egg.body, childPal), { x: clamp(q.x + side * (p.hx + 5), B.left + 6, B.right - 6), y: 6, density: 0.5, restitution: 0.1 });
      spawnBits(a.egg.pos().x, 4, SPARKLE, 16, { vy: 10, spread: 12, size: 0.45, life: 1.4, grav: 0 });
      a.exit = side > 0 ? B.left - 30 : B.right + 30;   // leave the other way
      return false;
    }
    if (a.t < 4.5) { p.face(Math.sign(a.egg.pos().x - q.x)); return false; } // a last look
    if (!p.leaving) {
      p.leaving = true;
      p.body.collider(0).setCollisionGroups(groups(G.PET, G.WORLD | G.PROP)); // through the side walls
      p.expr = 'open';
    }
    p.hopToward(a.exit, 2, dt);
    if (Math.abs(q.x - a.exit) > 12) return false;
    // gone: the egg becomes the new pet
    a.child.lineage.push({ name: save.name, form: save.formName, gen: save.gen, born: save.born, retired: Date.now() });
    const ex = a.egg.pos().x;
    a.egg.remove();
    replaceSave(a.child);
    writeSave();
    pal = palFor(save);
    p.build(recipeFor('egg'), 'egg', ex, 6);
    showBanner('A new egg!');
    return true;
  },
};

// ---- time away ----
// While the overlay was closed (or hidden) the pet carried on without anyone watching: it ate from
// the dispenser, slept, and got a little bored and lonely. It never comes back in a bad way, and it
// doesn't age, since age only counts time on screen.
function catchUp(seconds) {
  if (seconds < 60 || save.stage === 'egg') return;
  const hrs = Math.min(seconds, 3 * 86400) / 3600;
  N.hunger = clamp(Math.max(N.hunger, rand(55, 75)), 0, 100);
  N.energy = clamp(Math.max(N.energy, rand(80, 95)), 0, 100);
  N.fun = clamp(N.fun - Math.min(30, hrs * 10), 35, 100);
  N.social = clamp(N.social - Math.min(40, hrs * 15), 25, 100);
  N.hygiene = clamp(Math.max(N.hygiene, 80), 0, 100);
  save.health = Math.max(save.health, 80);
  save.digestAt = 0;
  if (hrs > 1 && Math.random() < 0.6) dropPoop(rand(B.left + 10, B.right - 10), 2); // a little welcome-back chore
}

// ---- banner: big text over the pet for the big moments ----
const bannerEl = document.getElementById('banner');
let bannerUntil = 0;
function showBanner(text) {
  bannerEl.textContent = text;
  bannerEl.classList.remove('show'); void bannerEl.offsetWidth; bannerEl.classList.add('show');
  bannerUntil = performance.now() + 4500;
}

// ---------------- chat and stream events ----------------
// Everything chat does is passive: it fills the social need, shapes traits, and gets reactions. The
// pet never needs it. Demo chat (?demo=1) is for show only and never counts toward its traits.
const BOTS = new Set(['nightbot', 'streamelements', 'streamlabs', 'moobot', 'fossabot', 'soundalerts', 'wizebot',
  'sery_bot', 'kofistreambot', 'botrixoficial', 'commanderroot', ...CFG.ignore.toLowerCase().split(/[\s,]+/).filter(Boolean)]);
const greets = [];                 // first-time chatters waiting for a wave
const recentChat = [];             // message times, for spotting hype
let demoing = false;               // true while demo chat is speaking: it doesn't count
const counts = () => !demoing;

function onChat({ name, text = '', platform = 'custom', emoteOnly = false, mod = false, first = false }) {
  if (!name || BOTS.has(String(name).toLowerCase())) return;
  const T = save.traits, now = performance.now();
  N.social = clamp(N.social + 3, 0, 100);
  life.lastChat = save.t;
  if (counts()) {
    save.events.chat++;
    T.social += 0.02;
    // remember who's chatted (hashed, capped) to know a first-timer, and how many there have been
    save.seen ??= [];
    const h = hashStr(platform + ':' + String(name).toLowerCase());
    if (!save.seen.includes(h)) {
      save.seen.push(h); if (save.seen.length > 5000) save.seen.shift();
      save.events.chatters++;
      if (save.stage !== 'egg') { greets.push(String(name).slice(0, 24)); if (greets.length > 3) greets.shift(); }
    }
  } else if (Math.random() < 0.15 && save.stage !== 'egg') greets.push(String(name).slice(0, 24));
  // a burst of messages or emote spam gets it hyped
  recentChat.push(now);
  while (recentChat.length && now - recentChat[0] > 20000) recentChat.shift();
  if (recentChat.length >= 10 || emoteOnly) {
    life.hype = Math.min(0.8, (life.hype ?? 0) + (emoteOnly ? 0.1 : 0.05));
    if (counts()) T.hyped += 0.03;
  }
  if (!pet.asleep && pet.action?.name === 'idle' && Math.random() < 0.4) pet.face(Math.random() < 0.5 ? -1 : 1); // glances over
  if (!first) learnFrom(text, name, platform);
  const fm = /^!pet\s+forget\s+(\S+)/i.exec(text);
  if (fm && mod && CFG.talk) { forgetWord(fm[1]); floatText(pet.pos().x, pet.pos().y + pet.hy + 2, '?', 'heart'); return; }
  if (CFG.cmds && /^!pet\b/i.test(text)) petCommand(text.slice(4).trim().toLowerCase(), name);
}

function petCommand(arg, name) {
  const q = pet.pos();
  if (arg === 'stats') { showStatus(6000); return; }
  if (arg === 'say' && CFG.talk) { say(); return; }
  for (let i = 0; i < 3; i++) setTimeout(() => floatText(q.x + rand(-3, 3), q.y + pet.hy + 2, '♥', 'heart'), i * 180);
  if (!pet.asleep) pet.mood('happy', 1.5);
}

// Timers keep running while the page isn't drawing (a hidden OBS source, a background tab, a preview
// scrolled out of view), so stream events only make things appear while the pet is actually on screen.
// They still count either way.
let lastFrameAt = 0;
const onScreen = () => !document.hidden && (lastFrameAt === 0 || performance.now() - lastFrameAt < 1000);

function onSub({ name, count = 1 }) {
  if (counts()) { save.events.subs += count; save.traits.generous += 0.3 * count; }
  N.social = clamp(N.social + 10, 0, 100);
  if (save.stage === 'egg' || !onScreen()) return;
  // a treat rains down
  for (let i = 0; i < Math.min(count, 3); i++) setTimeout(() => { if (onScreen()) dropFood('cake', spotNear(pet.pos().x, rand(-20, 20))); }, i * 400);
  showBubble('🎉');
}

function onBits({ name, amount = 100 }) {
  if (counts()) { save.events.bits += amount; save.traits.generous += amount / 500; }
  N.fun = clamp(N.fun + Math.min(30, amount / 50), 0, 100);
  if (!onScreen()) return;
  // coins rain from the top of the screen
  const n = clamp(Math.round(Math.log10(Math.max(10, amount)) * 4), 3, 14);
  sfx('coin');
  for (let i = 0; i < n; i++) {
    setTimeout(() => spawnBits(rand(B.left + 5, B.right - 5), screenTop(), [0xffd23f, 0xf2a33a, 0xfff3a0], 1,
      { vx: 0, vy: -10, spread: 4, size: 0.9, life: 4, grav: 0.6 }), i * 90);
  }
}

function onRaid({ name, viewers = 1 }) {
  if (counts()) {
    save.events.raids++;
    save.traits.hyped += 1 + Math.log10(Math.max(1, viewers));
    if (save.stage === 'egg') (save.flags ??= {}).raidHatch = true;
  }
  N.social = clamp(N.social + 25, 0, 100);
  life.hype = 0.8;
  if (!onScreen()) return;
  if (name) showBanner(`${name} is raiding! 🎊`);
  // confetti everywhere, scaled by raid size
  const n = clamp(Math.round(20 + Math.sqrt(viewers) * 6), 20, 160), colors = [0xff4d6d, 0x3ab0ff, 0xffd23f, 0x5cc04a, 0xb76bff, 0xffffff];
  for (let i = 0; i < n; i++) {
    setTimeout(() => spawnBits(rand(B.left, B.right), screenTop() + rand(0, 5), colors, 1,
      { vx: rand(-4, 4), vy: -5, spread: 3, size: 0.6, life: 5, grav: 0.18 }), i * 15);
  }
  if (save.stage === 'egg') return;
  if (pet.asleep && pet.action) { pet.action.def.end?.(pet, pet.action); pet.action = null; } // that'll wake anyone up
  setTimeout(() => window.pet.knock(0.7), 300);
}

function onFollow({ name }) {
  N.social = clamp(N.social + 4, 0, 100);
  if (counts()) save.traits.social += 0.05;
  const q = pet.pos();
  floatText(q.x, q.y + pet.hy + 2, '♥', 'heart');
}

// Wave hello to a first-time chatter, with their name over its head.
ACTIONS.greet = {
  score: () => (greets.length && !(pet.asleep && isNight()) ? 0.7 : 0),
  start(p, a) {

    const q = p.pos();

    sfx('chirp');
    if (p.grounded) p.body.applyImpulse({ x: 0, y: p.body.mass() * p.S.hopV * 0.5, z: 0 }, true);
  },
  step(p, dt, a) {
    for (const e of p.vis.anim) if (e.motion === 'loose') e.v += Math.sin(a.t * 16) * 30 * dt * (e.side || 1);
    return a.t > 1.6;
  },
  end(p) { p.expr = 'open'; N.social = clamp(N.social + 5, 0, 100); },
};

// ---- Twitch (anonymous IRC over WebSocket) ----
function parseTags(raw) {
  const o = {};
  const un = v => v.replace(/\\(.)/g, (_, c) => ({ s: ' ', ':': ';', '\\': '\\', r: '\r', n: '\n' }[c] ?? c));
  raw.split(';').forEach(kv => { const i = kv.indexOf('='); o[kv.slice(0, i)] = un(kv.slice(i + 1)); });
  return o;
}
function connectTwitch(channel) {
  const ws = new WebSocket('wss://irc-ws.chat.twitch.tv:443');
  ws.onopen = () => {
    ws.send('CAP REQ :twitch.tv/tags twitch.tv/commands');
    ws.send('PASS SCHMOOPIIE');
    ws.send('NICK justinfan' + Math.floor(10000 + Math.random() * 80000));
    ws.send('JOIN #' + channel);
  };
  ws.onmessage = (ev) => {
    for (const line of ev.data.split('\r\n')) {
      if (!line) continue;
      if (line.startsWith('PING')) { ws.send('PONG :tmi.twitch.tv'); continue; }
      const m = /^(?:@(\S+) )?:([^!\s]+)![^ ]+ PRIVMSG #\S+ :(.*)$/.exec(line);
      if (m) {
        const tags = m[1] ? parseTags(m[1]) : {}, name = tags['display-name'] || m[2];
        onChat({ name, text: m[3], platform: 'twitch', emoteOnly: tags['emote-only'] === '1',
          mod: /(^|,)(broadcaster|moderator)\//.test(tags.badges || ''), first: tags['first-msg'] === '1' });
        if (+tags.bits > 0) onBits({ name, amount: +tags.bits });
        continue;
      }
      const u = /^@(\S+) :tmi\.twitch\.tv USERNOTICE /.exec(line);
      if (u) {
        const t = parseTags(u[1]), id = t['msg-id'], name = t['display-name'] || t.login;
        if (['sub', 'resub', 'subgift', 'anonsubgift'].includes(id)) onSub({ name, count: 1 });
        else if (['submysterygift', 'anonsubmysterygift'].includes(id)) onSub({ name, count: +t['msg-param-mass-gift-count'] || 1 });
        else if (id === 'raid') onRaid({ name: t['msg-param-displayName'] || name, viewers: +t['msg-param-viewerCount'] || 1 });
      }
    }
  };
  ws.onclose = () => setTimeout(() => connectTwitch(channel), 3000);
}

// ---- Kick (anonymous, Kick's public Pusher chat socket) ----
const KICK_PUSHER = 'wss://ws-us2.pusher.com/app/32cbd69e4b950bf97679?protocol=7&client=js&version=8.4.0&flash=false';
async function connectKick(slug) {
  let chatroom;
  try {
    const r = await fetch(`https://kick.com/api/v2/channels/${encodeURIComponent(slug)}`);
    chatroom = (await r.json()).chatroom?.id;
    if (!chatroom) throw new Error('no chatroom');
  } catch (e) { console.warn('[pet] Kick channel lookup failed for', slug, e); return setTimeout(() => connectKick(slug), 30000); }
  kickSocket(chatroom);
}
function kickSocket(chatroom) {
  const ws = new WebSocket(KICK_PUSHER);
  ws.onmessage = (ev) => {
    let o; try { o = JSON.parse(ev.data); } catch { return; }
    if (o.event === 'pusher:connection_established') {
      ws.send(JSON.stringify({ event: 'pusher:subscribe', data: { auth: '', channel: `chatrooms.${chatroom}.v2` } }));
      return;
    }
    if (o.event === 'pusher:ping') { ws.send(JSON.stringify({ event: 'pusher:pong', data: {} })); return; }
    let d; try { d = typeof o.data === 'string' ? JSON.parse(o.data) : o.data; } catch { return; }
    if (!d) return;
    const ev2 = String(o.event).split('\\').pop();
    if (ev2 === 'ChatMessageEvent') {
      const text = (d.content || '').replace(/\[emote:\d+:([^\]]+)\]/g, '$1');
      onChat({ name: d.sender?.username, text, platform: 'kick', emoteOnly: /^(\s*\[emote:[^\]]+\]\s*)+$/.test(d.content || ''),
        mod: (d.sender?.identity?.badges || []).some(b => ['broadcaster', 'moderator'].includes(b.type)) });
    } else if (ev2 === 'SubscriptionEvent') onSub({ name: d.username, count: 1 });
    else if (ev2 === 'GiftedSubscriptionsEvent') onSub({ name: d.gifter_username, count: (d.gifted_usernames || []).length || 1 });
    else if (ev2 === 'StreamHostEvent') onRaid({ name: d.host_username, viewers: +d.number_viewers || 1 });
  };
  ws.onclose = () => setTimeout(() => kickSocket(chatroom), 3000);
  ws.onerror = () => {};
}

// ---- WebSocket bridges (TikFinity for TikTok, or any bridge for YouTube) ----
function connectBridge(url, platform) {
  let ws;
  try { ws = new WebSocket(url); } catch (e) { return setTimeout(() => connectBridge(url, platform), 5000); }
  ws.onmessage = (ev) => {
    let o; try { o = JSON.parse(ev.data); } catch { return; }
    const type = (o.event || o.type || '').toString().toLowerCase(), d = o.data || o;
    const name = d.nickname || d.uniqueId || d.displayName || d.chatname || d.user?.nickname || d.user?.uniqueId || d.user?.name || d.username;
    if (!type || ['chat', 'comment', 'message', 'chatmessage'].includes(type)) {
      const text = d.comment || d.message || d.text || d.chatmessage;
      if (name && typeof text === 'string') onChat({ name, text, platform });
    } else if (type === 'gift') {
      if (d.giftType === 1 && !d.repeatEnd) return; // streak still going; count it once at the end
      onBits({ name, amount: (d.diamondCount || 1) * (d.repeatCount || 1) * 5 });
    } else if (type === 'subscribe' || type === 'member') onSub({ name, count: 1 });
    else if (type === 'follow') onFollow({ name });
    else if (type === 'raid') onRaid({ name, viewers: +d.viewers || +d.viewerCount || 1 });
  };
  ws.onclose = () => setTimeout(() => connectBridge(url, platform), 3000);
  ws.onerror = () => {};
}

// ---- YouTube (Data API v3 polling) ----
async function connectYouTube(videoId, key) {
  const API = 'https://www.googleapis.com/youtube/v3/';
  const retry = () => setTimeout(() => connectYouTube(videoId, key), 30000);
  let chatId;
  try {
    const r = await fetch(`${API}videos?part=liveStreamingDetails&id=${encodeURIComponent(videoId)}&key=${encodeURIComponent(key)}`);
    chatId = (await r.json()).items?.[0]?.liveStreamingDetails?.activeLiveChatId;
    if (!chatId) return retry();
  } catch (e) { return retry(); }
  let pageToken = '', first = true;
  const poll = async () => {
    let wait = CFG.ytpoll * 1000;
    try {
      const r = await fetch(`${API}liveChat/messages?liveChatId=${encodeURIComponent(chatId)}&part=snippet,authorDetails&maxResults=200&key=${encodeURIComponent(key)}${pageToken ? '&pageToken=' + pageToken : ''}`);
      const j = await r.json();
      if (j.error) { if (r.status === 403 || r.status === 404) return retry(); wait = 15000; }
      else {
        pageToken = j.nextPageToken || pageToken;
        wait = Math.max(wait, j.pollingIntervalMillis || 0);
        if (!first) {
          (j.items || []).forEach((it, i) => setTimeout(() => {
            const sn = it.snippet || {}, name = it.authorDetails?.displayName;
            if (sn.type === 'superChatEvent' || sn.type === 'superStickerEvent') onBits({ name, amount: Math.round((sn.superChatDetails?.amountMicros || sn.superStickerDetails?.amountMicros || 1e6) / 1e4) });
            else if (sn.type === 'newSponsorEvent' || sn.type === 'memberMilestoneChatEvent') onSub({ name, count: 1 });
            else if (sn.type === 'membershipGiftingEvent') onSub({ name, count: sn.membershipGiftingDetails?.giftMembershipsCount || 1 });
            else if (sn.displayMessage) onChat({ name, text: sn.displayMessage, platform: 'youtube' });
          }, i / Math.max(1, j.items.length) * wait * 0.8));
        }
        first = false; // skip the backlog on connect
      }
    } catch (e) { wait = 15000; }
    setTimeout(poll, wait);
  };
  poll();
}
const ytId = (v) => (/(?:v=|youtu\.be\/|live\/)([\w-]{11})/.exec(v) || [])[1] || v;
